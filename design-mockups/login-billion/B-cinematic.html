<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Login mockup B — cinematic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@200;300;500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<style>
/* B — "Clubhouse": a real Thai fairway full-bleed, a caddie in frame, the product in one hand. Fewer elements, bigger
   presence. Real LGV2 tokens: Instrument Sans, JetBrains Mono labels, Outfit numerals, LINE #06C755, green #22c55e. */
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:#03110B;color:#fff;font-family:'Instrument Sans',sans-serif;overflow-x:hidden}
.root{position:relative;min-height:100dvh;display:flex;flex-direction:column}
.photo{position:absolute;inset:0;background:url(photos/tee-caddy.jpg) 62% 30%/cover no-repeat}
.scrim{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(3,17,11,.45) 0%,rgba(3,17,11,.08) 28%,rgba(3,17,11,.5) 58%,#03110B 100%)}
.top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:18px 20px}
.wm{height:30px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
.lang{display:inline-flex;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.lang b{font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.06em;padding:7px 11px;border-radius:999px;color:rgba(255,255,255,.75)}
.lang b.on{background:#fff;color:#07271B}
.live{font:600 8.5px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 11px;backdrop-filter:blur(8px)}
.live i{width:6px;height:6px;border-radius:99px;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.9)}

.body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 16px}
.left{display:flex;flex-direction:column;justify-content:flex-end}
.kicker{font:600 9.5px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#4ade80;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.kicker:before{content:"";width:22px;height:1px;background:#4ade80}
.h1{font:500 clamp(34px,9.4vw,52px)/1.04 'Outfit',sans-serif;letter-spacing:-.03em;margin:10px 0 0;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.h1 em{font-style:normal;font-weight:200}
.sub{font:500 14px/1.5 'Instrument Sans',sans-serif;color:rgba(255,255,255,.85);max-width:36ch;margin:10px 0 0;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.trust{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.trust .logos{display:flex}
.trust .logos img{width:28px;height:28px;border-radius:50%;border:2px solid #03110B;object-fit:cover;margin-left:-8px;background:#fff}
.trust .logos img:first-child{margin-left:0}
.trust span{font:600 10px/1.35 'JetBrains Mono',monospace;letter-spacing:.08em;color:rgba(255,255,255,.75);text-transform:uppercase}
.trust b{color:#fff}

.dock{position:relative;z-index:4;margin-top:16px;background:rgba(6,20,14,.66);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:14px 14px 12px;backdrop-filter:blur(18px);box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.btn{width:100%;height:54px;border:0;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font:600 15.5px/1 'Instrument Sans',sans-serif;cursor:pointer}
.line{background:#06C755;color:#fff;box-shadow:0 10px 26px rgba(6,199,85,.4)}
.alt{display:flex;gap:8px;margin-top:9px}
.alt .btn{height:46px;border-radius:13px;font-size:12.5px}
.kakao{background:#FEE500;color:#3C1E1E} .google{background:#fff;color:#1f2328}
.links{display:flex;justify-content:center;gap:5px 14px;flex-wrap:wrap;margin-top:12px;font:600 12.5px/1 'Instrument Sans',sans-serif;color:rgba(255,255,255,.88)}
.links span{display:flex;align-items:center;gap:5px}.links .ms{font-size:15px;color:#22c55e}.links .staff{color:rgba(255,255,255,.5)}.links .staff .ms{color:rgba(255,255,255,.4)}
.ms{font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1;font-size:20px}

.strip{position:relative;z-index:3;display:flex;gap:8px;padding:10px 20px 18px;overflow:hidden}
.strip .t{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 12px 8px 9px;font:600 11px/1 'Instrument Sans',sans-serif;color:rgba(255,255,255,.9)}
.strip .ms{font-size:15px;color:#22c55e;font-variation-settings:'FILL' 0}

.device{display:none}

@media (min-width:1180px){
  .root{height:100dvh;overflow:hidden}
  .photo{background-position:center 40%}
  .scrim{background:linear-gradient(90deg,rgba(3,17,11,.82) 0%,rgba(3,17,11,.55) 34%,rgba(3,17,11,.05) 60%,rgba(3,17,11,.1) 100%),linear-gradient(180deg,rgba(3,17,11,.25),transparent 30%,transparent 72%,rgba(3,17,11,.7))}
  .top{padding:24px 56px}.wm{height:38px}
  .body{display:grid;grid-template-columns:660px 1fr;align-items:end;padding:0 56px 44px;column-gap:24px;min-height:0}
  .left{grid-column:1;display:flex;flex-direction:column;justify-content:flex-end}
  .h1{font-size:50px;margin-top:14px}.sub{font-size:16.5px;margin-top:14px}
  .trust{margin-top:22px}
  .dock{margin-top:26px;width:420px;padding:16px 16px 14px}
  .strip{position:absolute;left:56px;bottom:14px;padding:0;gap:10px}
  .device{display:block;grid-column:2;grid-row:1;justify-self:end;align-self:end;position:relative;width:300px;height:470px;margin-bottom:-44px}
  .device .ph{position:absolute;right:0;bottom:0;width:250px;border-radius:30px;border:7px solid #0b1a13;box-shadow:0 40px 80px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.14) inset;overflow:hidden;background:#000;transform:rotate(-4deg)}
  .device .ph img{display:block;width:100%}
  .device .card{position:absolute;left:0;top:70px;width:300px;background:rgba(6,20,14,.78);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;backdrop-filter:blur(14px);box-shadow:0 30px 60px rgba(0,0,0,.5)}
  .device .card .k{font:600 8.5px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#4ade80;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .device .card .k i{width:6px;height:6px;border-radius:99px;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.9)}
  .device .card .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font:500 13px/1 'Instrument Sans',sans-serif}
  .device .card .row:last-child{border:0}
  .device .card .row b{font:300 18px/1 'Outfit',sans-serif}
  .device .card .row .g{color:#4ade80}
  .device .card .nm{display:flex;align-items:center;gap:8px}
  .device .card .av{width:22px;height:22px;border-radius:50%;background:#1f3a2b;font:700 9px/22px 'JetBrains Mono',monospace;text-align:center;color:#9ae6b4}
}
.see{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid rgba(255,255,255,.1);font:600 12.5px/1 'Instrument Sans',sans-serif;color:#fff;cursor:pointer}
.see .ms{font-size:16px;color:#22c55e;font-variation-settings:'FILL' 0}
.see b{font:600 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.06em;color:rgba(255,255,255,.6);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 8px}
.ph,.desk{cursor:pointer}.ph:hover,.desk:hover{outline:2px solid #22c55e;outline-offset:3px}
</style></head><body>
<div class="root"><div class="photo"></div><div class="scrim"></div>
  <div class="top">
    <img class="wm" src="../../public/mcipro-wordmark-white.png" alt="MyCaddiPro">
    <div style="display:flex;align-items:center;gap:10px"><span class="lang"><b class="on">EN</b><b>TH</b><b>KO</b><b>JA</b></span></div>
  </div>
  <div class="body">
    <div class="left">
      <div class="copy">
        <div class="kicker">The golf operating system</div>
        <h1 class="h1">The tee sheet, the caddies,<br>the scores. <em>Run from one place.</em></h1>
        <p class="sub">For golf courses, societies, caddies and the golfers who play with them. Live every day.</p>
      </div>
      <div class="dock">
        <button class="btn line"><span class="ms">chat_bubble</span>Continue with LINE</button>
        <div class="alt"><button class="btn kakao"><span class="ms">chat</span>Kakao</button><button class="btn google">Google</button></div>
        <div class="links"><span><span class="ms">person_add</span>New here? Create account</span><span><span class="ms">badge</span>Caddy? Register</span><span class="staff"><span class="ms">store</span>Staff entrance</span></div>
    <div class="see"><span class="ms">visibility</span>See inside the app<b>15 screens</b></div>
      </div>
    </div>
    <div class="device">
      <div class="ph"><img src="../../public/login-showcase/live.webp" alt=""></div>
    </div>
  </div>
</div>
</body></html>
