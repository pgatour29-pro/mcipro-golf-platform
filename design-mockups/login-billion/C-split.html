<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Login mockup C - split</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@300;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<style>
/* C - "Split": asymmetric split hero. Left = light sign-in panel (the app's own white dashboards), right = the product wall:
   the real tee sheet and two real phone screens on a fairway photo. One accent (brand green), soft radius lock (16px), pill buttons. */
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:#F4F6F2;color:#0F1A14;font-family:'Instrument Sans',sans-serif;overflow-x:hidden}
.root{min-height:100dvh;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.wm{height:30px}
.lang{display:inline-flex;background:#E6EBE3;border-radius:999px;padding:3px}
.lang b{font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.06em;padding:7px 11px;border-radius:999px;color:#4B5B50}
.lang b.on{background:#0F1A14;color:#fff}

.main{display:flex;flex-direction:column;min-height:0;flex:1}
.copy{padding:8px 20px 0}
.h1{font:600 clamp(34px,9vw,44px)/1.04 'Outfit',sans-serif;letter-spacing:-.03em;margin:0;color:#0F1A14}
.h1 .g{color:#16a34a}
.sub{font:500 14px/1.5 'Instrument Sans',sans-serif;color:#4B5B50;max-width:36ch;margin:10px 0 0}

.wall{position:relative;margin:14px 0 0;flex:1;min-height:300px;overflow:hidden;background:#06160E url(photos/green-flag.jpg) center 55%/cover no-repeat}
.wall:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,22,14,.2),rgba(6,22,14,.5) 60%,rgba(6,22,14,.75) 100%)}
.wall .desk{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:92%;max-width:560px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.2);box-shadow:0 30px 60px rgba(3,20,10,.5);background:#000}
.wall .desk img{display:block;width:100%}
.wall .ph{position:absolute;top:150px;width:128px;border-radius:18px;border:5px solid #0b1a13;overflow:hidden;background:#000;box-shadow:0 24px 50px rgba(3,20,10,.55)}
.wall .ph img{display:block;width:100%}
.wall .ph.l{left:7%;transform:rotate(-6deg)}
.wall .ph.r{right:7%;transform:rotate(6deg)}

.dock{margin:-90px 16px 16px;position:relative;z-index:2;background:#fff;border:1px solid #DCE3DA;border-radius:20px;padding:14px 14px 12px;box-shadow:0 20px 50px rgba(15,26,20,.12)}
.btn{width:100%;height:54px;border:0;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;font:600 15.5px/1 'Instrument Sans',sans-serif;cursor:pointer}
.line{background:#06C755;color:#fff}
.alt{display:flex;gap:8px;margin-top:9px}
.alt .btn{height:46px;font-size:12.5px}
.kakao{background:#FEE500;color:#3C1E1E} .google{background:#fff;color:#1f2328;border:1.5px solid #DCE3DA}
.links{display:flex;justify-content:center;gap:5px 14px;flex-wrap:wrap;margin-top:12px;font:600 12.5px/1 'Instrument Sans',sans-serif;color:#0F1A14}
.links span{display:flex;align-items:center;gap:5px}.links .ms{font-size:15px;color:#16a34a}.links .staff{color:#6B7A70}.links .staff .ms{color:#8E9A92}
.ms{font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1;font-size:20px}

@media (min-width:1180px){
  .root{grid-template-rows:1fr;grid-template-columns:minmax(440px,42%) 1fr;min-height:100dvh}
  .top{position:absolute;left:0;top:0;width:100%;padding:24px 48px;z-index:3}
  .top .lang{background:rgba(255,255,255,.9)}
  .main{grid-column:1;display:flex;flex-direction:column;justify-content:center;padding:96px 48px 40px;position:static}
  .copy,.dock{position:relative;z-index:2}
  .copy{padding:0}
  .h1{font-size:50px}
  .sub{font-size:16px;margin-top:14px}
  .dock{margin:28px 0 0;width:400px;padding:16px;box-shadow:none;border:1px solid #DCE3DA}
  .root{position:relative;overflow:hidden}
  .wall{position:absolute;right:0;top:0;width:62%;height:100%;margin:0;background-position:center 70%}
  .wall:before{background:linear-gradient(90deg,#F4F6F2 0%,rgba(244,246,242,0) 32%),linear-gradient(180deg,rgba(6,22,14,.25),rgba(6,22,14,.6))}
  .wall .desk{left:auto;right:-80px;top:50%;transform:translateY(-54%);width:760px;max-width:none;border-radius:16px}
  .wall .ph{width:208px;bottom:auto;top:50%;border-radius:28px;border-width:7px}
  .wall .ph.l{left:60px;transform:translateY(-38%) rotate(-5deg)}
  .wall .ph.r{left:230px;transform:translateY(-16%) rotate(4deg)}
}
</style></head><body>
<div class="root">
  <div class="top">
    <img class="wm" src="../../public/mcipro-wordmark.png" alt="MyCaddiPro">
    <span class="lang"><b class="on">EN</b><b>TH</b><b>KO</b><b>JA</b></span>
  </div>
  <div class="main">
    <div class="copy">
      <h1 class="h1">Run the course.<br>Book the caddie.<br><span class="g">Score it live.</span></h1>
      <p class="sub">The platform golf courses, societies and caddies work on every day.</p>
    </div>
    <div class="wall">
      <div class="desk"><img src="../../public/login-showcase/ts-day.webp" alt="Tee sheet, Pattaya Golf Club"></div>
      <div class="ph l"><img src="../../public/login-showcase/caddy.webp" alt="Caddie booking"></div>
      <div class="ph r"><img src="../../public/login-showcase/live.webp" alt="Live scoring"></div>
    </div>
    <div class="dock">
      <button class="btn line"><span class="ms">chat_bubble</span>Continue with LINE</button>
      <div class="alt"><button class="btn kakao"><span class="ms">chat</span>Kakao</button><button class="btn google">Google</button></div>
      <div class="links"><span><span class="ms">person_add</span>New here? Create account</span><span><span class="ms">badge</span>Caddy? Register</span><span class="staff"><span class="ms">store</span>Staff entrance</span></div>
    </div>
  </div>
</div>
</body></html>
