<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup B — Night Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0A0F1A; --bg1:#111827; --glass:rgba(255,255,255,.045); --glass-line:rgba(255,255,255,.09);
    --text:#F2F5F7; --muted:#8C96A1; --green:#22C55E; --green-hi:#4ADE80; --green-deep:#15803D;
    --rose:#FB7185; --red:#EF4444; --cyan:#22D3EE; --amber:#FBBF24;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:linear-gradient(170deg,#0A0F1A,#111827 55%,#0D1520);color:var(--text);font-family:'Instrument Sans',sans-serif}
  .app{height:100vh;display:flex;flex-direction:column;padding:10px 12px 10px;gap:8px}
  .panel{background:var(--glass);border:1px solid var(--glass-line);border-radius:16px}

  /* ---------- header ---------- */
  .head{display:flex;align-items:center;gap:10px;padding:8px 10px}
  .gauge{width:62px;height:62px;border-radius:50%;position:relative;flex:none;
    background:conic-gradient(var(--green) 0deg 240deg, rgba(255,255,255,.10) 240deg 360deg)}
  .gauge::before{content:'';position:absolute;inset:4px;border-radius:50%;background:#101725}
  .gauge .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .n b{font:300 26px/1 'Outfit',sans-serif;color:var(--text)}
  .gauge .n s{text-decoration:none;font:600 7px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--muted)}
  .headmid{flex:1;min-width:0}
  .hm1{font:500 15px/1.2 'Instrument Sans',sans-serif}
  .hm2{font:500 11px/1 'JetBrains Mono',monospace;color:var(--green-hi);letter-spacing:.06em;margin-top:4px}
  .hm3{font:500 10px/1 'JetBrains Mono',monospace;color:var(--cyan);letter-spacing:.06em;margin-top:5px}
  .hm3 span{color:var(--amber)}
  .headbtns{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .end{font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--rose);
    background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);border-radius:999px;padding:6px 12px}
  .chevrow{display:flex;gap:6px}
  .chev{width:32px;height:32px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-line);
    color:var(--text);font:300 17px/1 'Outfit',sans-serif}

  .dots{display:flex;gap:3px;padding:0 3px}
  .dots i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
  .dots i.done{background:var(--green-deep)}
  .dots i.cur{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,.8)}

  /* ---------- players ---------- */
  .players{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .pc{background:var(--glass);border:1px solid var(--glass-line);border-radius:13px;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 9px}
  .pc .tag{font:700 7px/1 'JetBrains Mono',monospace;letter-spacing:.1em;padding:3px 6px;border-radius:999px;
    background:rgba(255,255,255,.08);color:var(--muted)}
  .pc .name{font:600 13px/1 'Instrument Sans',sans-serif;margin-top:2px}
  .pc .score{font:200 30px/1 'Outfit',sans-serif;margin:2px 0}
  .pc .score.empty{color:rgba(255,255,255,.22)}
  .pc .meta{font:500 8.5px/1.4 'JetBrains Mono',monospace;color:var(--muted);text-align:center;letter-spacing:.03em}
  .pc .meta b{color:var(--green-hi)}
  .pc.active{border-color:var(--green);box-shadow:0 0 0 2px rgba(34,197,94,.25),0 0 18px rgba(34,197,94,.18)}
  .pc.active .tag{background:rgba(34,197,94,.18);color:var(--green-hi)}
  .pc.locked{border-color:rgba(239,68,68,.4)}
  .pc.locked .tag{background:rgba(239,68,68,.16);color:#FCA5A5}

  /* ---------- namecard ---------- */
  .namecard{display:flex;align-items:center;gap:10px;padding:9px 14px;position:relative;overflow:hidden}
  .ghost{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font:200 58px/1 'Outfit',sans-serif;color:rgba(255,255,255,.06)}
  .nc-name{font:700 19px/1 'Instrument Sans',sans-serif;color:var(--green-hi)}
  .nc-calc{flex:1;font:500 10.5px/1 'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.04em}
  .nc-calc b{color:var(--text)}
  .xclr{width:26px;height:26px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);
    color:var(--muted);font:400 11px/24px 'Instrument Sans',sans-serif;text-align:center;z-index:1}

  /* ---------- keypad ---------- */
  .keys{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:7px;min-height:0}
  .key{border-radius:14px;background:var(--glass);border:1px solid var(--glass-line);
    font:300 27px/1 'Outfit',sans-serif;color:var(--text);position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .key.netpar{border-color:var(--green);background:rgba(34,197,94,.13);box-shadow:0 0 0 2px rgba(34,197,94,.22),inset 0 1px 0 rgba(255,255,255,.06)}
  .key.netpar::after{content:'NET PAR';position:absolute;left:50%;transform:translateX(-50%);bottom:5px;
    font:700 6.5px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--green-hi)}
  .key.fn{font:400 17px/1 'Instrument Sans',sans-serif;color:var(--muted)}
  .key.panic{font:700 12px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#FCA5A5;
    background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4)}

  .pickup{height:38px;border-radius:12px;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.08);
    color:#FCA5A5;font:700 11px/1 'JetBrains Mono',monospace;letter-spacing:.1em}

  /* ---------- dock ---------- */
  .dock{display:flex;gap:8px}
  .dockbtn{flex:1;height:54px;border-radius:15px;background:var(--glass);border:1px solid var(--glass-line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text);position:relative}
  .dockbtn i{font-style:normal;font-size:16px;line-height:1}
  .dockbtn s{text-decoration:none;font:600 8.5px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--muted)}
  .dockbtn .b{position:absolute;top:6px;right:12px;font:700 8px/1 'JetBrains Mono',monospace;
    background:var(--amber);color:#3F3000;border-radius:999px;padding:2px 5px}
  .dock .finish{flex:1.25;background:linear-gradient(180deg,#34D873,#15803D);border:none;
    box-shadow:0 4px 16px rgba(34,197,94,.35)}
  .dock .finish i{font-size:15px}
  .dock .finish b{font:700 11px/1 'Instrument Sans',sans-serif;letter-spacing:.05em;color:#fff}
  .dock .finish s{color:rgba(255,255,255,.75)}
  button{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header class="panel head">
    <div class="gauge"><div class="n"><b>12</b><s>OF 18</s></div></div>
    <div class="headmid">
      <div class="hm1">&#9873; MyCaddiPro</div>
      <div class="hm2">PAR 3 &middot; SI 16 &middot; 168 Y</div>
      <div class="hm3">F9 1:58 &middot; <span>TOTAL 2:41</span></div>
    </div>
    <div class="headbtns">
      <button class="end">END</button>
      <div class="chevrow">
        <button class="chev">&#8249;</button>
        <button class="chev">&#8250;</button>
      </div>
    </div>
  </header>

  <div class="dots">
    <i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i>
    <i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i>
    <i class="cur"></i>
    <i></i><i></i><i></i><i></i><i></i><i></i>
  </div>

  <section class="players">
    <div class="pc active">
      <span class="tag">SCORING</span>
      <div class="name">Dave</div>
      <div class="score empty">&ndash;</div>
      <div class="meta">HCP 12<br><b>21 PTS</b></div>
    </div>
    <div class="pc">
      <span class="tag">DONE</span>
      <div class="name">Pete</div>
      <div class="score">3</div>
      <div class="meta">HCP 18<br><b>24 PTS</b></div>
    </div>
    <div class="pc locked">
      <span class="tag">HER PHONE</span>
      <div class="name">Som</div>
      <div class="score">4</div>
      <div class="meta">HCP 9<br><b>19 PTS</b></div>
    </div>
    <div class="pc">
      <span class="tag">DONE</span>
      <div class="name">Erik</div>
      <div class="score">3</div>
      <div class="meta">HCP 15<br><b>17 PTS</b></div>
    </div>
  </section>

  <div class="panel namecard">
    <div class="nc-name">DAVE</div>
    <div class="nc-calc">TAP A NUMBER &mdash; <b>SAVES INSTANTLY</b> &middot; NET PAR 3</div>
    <button class="xclr">&#10005;</button>
    <div class="ghost">3</div>
  </div>

  <section class="keys">
    <button class="key">1</button>
    <button class="key">2</button>
    <button class="key netpar">3</button>
    <button class="key">4</button>
    <button class="key">5</button>
    <button class="key">6</button>
    <button class="key">7</button>
    <button class="key">8</button>
    <button class="key">9</button>
    <button class="key fn">&#9003;</button>
    <button class="key">0</button>
    <button class="key panic">PANIC</button>
  </section>

  <button class="pickup">NO POINT &mdash; PICKUP</button>

  <footer class="dock">
    <button class="dockbtn"><i>&#127942;</i><s>BOARD</s></button>
    <button class="dockbtn"><i>&#127922;</i><s>GAMES</s><span class="b">2</span></button>
    <button class="dockbtn"><i>&#128203;</i><s>CARD</s></button>
    <button class="dockbtn finish"><i>&#10003;</i><b>FINISH</b><s>SAVES SCORES</s></button>
  </footer>
</div>
</body>
</html>
