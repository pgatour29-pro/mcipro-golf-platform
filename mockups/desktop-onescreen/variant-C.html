<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f3f4f6;display:flex;flex-direction:column}
  .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;display:inline-block;line-height:1;letter-spacing:normal;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased}
  /* ===== GHD2-D one-row dark-green header (simulated) ===== */
  header.ghd2{background:linear-gradient(180deg,#071a0e,#0c2a16);border-bottom:2px solid #22c55e;box-shadow:0 2px 14px rgba(2,20,8,.45);flex-shrink:0}
  .ghd2-in{max-width:1280px;margin:0 auto;padding:9px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .ghd2-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#065f46);box-shadow:0 0 0 2px rgba(74,222,128,.7);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0}
  .ghd2-name{color:#fff;font-weight:600;font-size:15px;line-height:1.2}
  .ghd2-sub{color:rgba(255,255,255,.75);font-size:12px}
  .ghd2-hcp{background:rgba(34,197,94,.2);border:1px solid rgba(74,222,128,.4);color:#4ade80;font-weight:700;padding:1px 7px;border-radius:99px;font-size:11px}
  .ghd2-tabs{display:flex;align-items:center;justify-content:center;gap:2px;flex:1;min-width:0}
  .ghd2-tab{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:rgba(255,255,255,.78);font-size:12px;padding:7px 9px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
  .ghd2-tab .material-symbols-outlined{font-size:16px}
  .ghd2-tab.active{color:#4ade80;font-weight:700;border-bottom-color:#4ade80}
  .ghd2-tab.red{color:#f87171;font-weight:650}
  .ghd2-ico{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .ghd2-ico .material-symbols-outlined{font-size:18px}
  .ghd2-ico.red{color:#f87171;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.1)}
  .ghd2-ico.logout{color:#fca5a5;border-color:rgba(248,113,113,.45);background:rgba(220,38,38,.2)}
  .ghd2-lang{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 10px;border-radius:99px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#e2e8f0;font-size:12px;font-weight:700}
  /* ===== content area ===== */
  main{flex:1;min-height:0;max-width:1280px;width:100%;margin:0 auto;padding:14px 24px 16px}
  /* ===== cube base (mirrors .metric-card + .cube-poster) ===== */
  .cube{position:relative;border:none;cursor:pointer;background:#fff;border-radius:22px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-family:inherit;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;padding:16px 14px 14px;min-width:0;min-height:0}
  .cube-poster{background:linear-gradient(130deg,var(--p1) 0%,var(--p2) 55%,#ffffff 130%);border:1px solid rgba(22,35,46,.08);overflow:hidden}
  .cube h3{font-size:17px;font-weight:800;line-height:1.1;letter-spacing:-.01em;color:#152430;position:relative;z-index:2}
  .cube-art{pointer-events:none;position:absolute;right:-14px;bottom:-16px;width:104px;height:104px;transform:rotate(-5deg);z-index:1;filter:drop-shadow(0 10px 14px rgba(22,35,46,.22))}
  .cube-art svg{width:100%;height:100%;display:block}
  .cube-pill{position:absolute;left:14px;bottom:13px;z-index:2;background:rgba(255,255,255,.78);color:#33475c;box-shadow:0 1px 3px rgba(22,35,46,.12);font-weight:700;font-size:11px;line-height:1;padding:5px 10px;border-radius:999px;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cube-sub{position:relative;z-index:2;margin-top:2px;font-size:11px;font-weight:600;color:#64748b;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hcp-val{font-size:32px;font-weight:800;color:#16a34a;line-height:1;position:relative;z-index:2;margin-top:4px}
  .soon{position:absolute;top:4px;right:4px;font-size:9px;font-weight:700;color:#dc2626;background:#fef2f2;padding:2px 6px;border-radius:4px;z-index:3}
  .cbadge{position:absolute;top:8px;right:8px;background:#0d9488;color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 1px 5px rgba(0,0,0,.3);z-index:3;line-height:1}
  .cbadge.green{background:#16a34a;font-size:10px;padding:0 7px;letter-spacing:.02em}
  /* Play Golf cube: canonical look, NEVER postered */
  .cube-play{border:3px solid #22c55e;box-shadow:0 0 12px rgba(34,197,94,.4);align-items:center;justify-content:center;text-align:center}
  .cube-play .pg-ico{width:48px;height:48px;border-radius:50%;overflow:hidden;margin-bottom:8px}
  .cube-play .pg-ico img{width:100%;height:100%;object-fit:cover}
  .cube-play h3{color:#15803d}
  .cube-play .pg-pill{font-size:12px;background:#f0fdf4;color:#15803d;padding:4px 12px;border-radius:999px;margin-top:4px;font-weight:600}
  /* split cell (Society Events + Tee Sheet stacked) */
  .cube-split{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
  .cube-split .cube{flex:1 1 0;min-height:0;width:100%;padding:8px 12px;justify-content:center}
  .cube-split .cube h3{font-size:15px}
  .cube-split .cube .cube-art{right:-12px;bottom:-14px;width:54px;height:54px;filter:drop-shadow(0 6px 9px rgba(22,35,46,.22))}
  /* variant tag chip */
  .vtag{position:fixed;left:10px;bottom:10px;background:#111827;color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;z-index:99;opacity:.85}
</style>

</header>
