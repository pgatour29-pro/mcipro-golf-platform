<!DOCTYPE html>
<html lang="en" data-theme="dark" class="ts-day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyCaddy Pro • Facility tee sheet (mockup)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="teesheet.css">
  <style>
    /* ===== mockup-only additions, built on the tee sheet's own tokens (no new colours) ===== */
    body{margin:0}
    .main-content{padding:0}
    .ts-oldfind,.ts-setup{display:none!important}
    .fx-sub{display:block;font:600 10.5px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.3px;margin-top:1px}
    .course-name-display{line-height:1.1}
    /* facility course rail: ALL · each course, with live fill */
    .fx-rail{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line-2);height:44px;box-sizing:border-box;flex:none}
    .fx-rail button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:0 12px;height:36px;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
    .fx-rail button .d{width:9px;height:9px;border-radius:3px;background:var(--cc);flex:none}
    .fx-rail button .nm{font-weight:800;font-size:12.5px;color:var(--ink-2)}
    .fx-rail button .nm i{font-style:normal;color:var(--vip);margin-left:3px}
    .fx-rail button .f{font:700 11px 'IBM Plex Mono',monospace;color:var(--muted)}
    .fx-rail button.on{background:var(--card-hi);box-shadow:inset 0 0 0 1px var(--line-2)}
    .fx-rail button.on .nm{color:var(--ink)}
    .fx-rail button.all.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 55%,transparent)}
    .fx-rail button.all .nm{color:var(--brand)}
    .fx-rail .m{width:38px;height:4px;border-radius:3px;background:var(--line-2);overflow:hidden}
    .fx-rail .m i{display:block;height:100%;background:var(--cc)}
    .today-btn.primary{background:var(--brand);color:var(--badge-ink);border-color:var(--brand);font-weight:800;padding:0 14px}
    .today-btn .n{display:inline-block;margin-left:5px;background:var(--vip);color:#1a1204;border-radius:9px;padding:0 6px;font:800 10.5px 'IBM Plex Mono',monospace}
    .controls-row .grow{flex:1}
    /* facility KPI strip (DAY view hides the legend row, so this one rides the controls) */
    .fx-kpis{display:flex;align-items:stretch;gap:0;background:var(--board-2);border-bottom:1px solid var(--line);padding:0 18px;overflow-x:auto;scrollbar-width:none}
    .fx-k{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 0;margin-right:16px;border-right:1px solid var(--line-2);white-space:nowrap}
    .fx-k:last-child{border-right:0}
    .fx-k .d{width:10px;height:10px;border-radius:3px;background:var(--cc);flex:none}
    .fx-k .t{font-size:11px;font-weight:800;color:var(--ink-2);letter-spacing:.2px}
    .fx-k .t small{display:block;font:600 10px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:0}
    .fx-k .v{display:flex;gap:12px}
    .fx-k .v span{font:700 12px 'IBM Plex Mono',monospace;color:var(--ink)}
    .fx-k .v span b{display:block;font:600 9px 'Hanken Grotesk',sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    .fx-k .v span.g{color:var(--brand)}
    .fx-k.tot .t{color:var(--brand)}
    .fx-k .cad{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;font:700 11px 'IBM Plex Mono',monospace;color:var(--ink-2)}
    .fx-k .cad.warn{border-color:var(--vip);color:var(--vip)}
    /* grid: course headers carry the course's own colour (same --acc mechanics as A/B/C) */
    .grid-header-cell.course-a{--acc:var(--course-a-header)}.grid-header-cell.course-b{--acc:var(--course-b-header)}.grid-header-cell.course-c{--acc:var(--course-c-header)}
    html.ts-day .gh-badge{width:auto;padding:0 5px;font-size:9.5px;letter-spacing:.3px}
    html.ts-day .gh-name i{font-style:normal;color:var(--vip);font-size:11px}
    html.ts-day .gh-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
    .fx-k{padding-right:10px;margin-right:10px;gap:8px}.fx-k .v{gap:9px}.fx-k .v span{font-size:11.5px}.fx-k .t{font-size:10.5px}.fx-k .cad{padding:2px 7px;font-size:10.5px}
    .slot.off{background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 5px,transparent 5px 10px);cursor:default}
    .pill.member{--c:var(--regular)}
    .pill .mb{flex:none;font:800 8.5px 'IBM Plex Mono',monospace;color:var(--vip);border:1px solid color-mix(in srgb,var(--vip) 55%,transparent);border-radius:4px;padding:0 3px;line-height:13px}
    html.ts-day .pill .mb{margin-left:auto}
    .pill.ghost{opacity:.55;border-style:dashed}
    /* the NOW line in DAY columns */
    .ts-nowrow{position:relative;height:0;z-index:12;overflow:visible}
    /* other-courses strip under a single-course view */
    .fx-others{display:flex;align-items:center;gap:10px;padding:6px 18px;background:var(--board-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
    .fx-others .nsl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);opacity:.8;flex:none}
    .fx-others button{flex:none;height:28px;border-radius:999px;border:1px solid var(--line-2);background:var(--card-hi);color:var(--ink);padding:0 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
    .fx-others button .d{width:8px;height:8px;border-radius:2px;background:var(--cc)}
    .fx-others button b{color:var(--brand);font-weight:800}
    .fx-others button em{font-style:normal;color:var(--vip);font-weight:700}
    /* ===== master booking dialog (rides the real booking-dialog tokens) ===== */
    .fx-dim{position:fixed;inset:0;background:rgba(2,6,12,.62);backdrop-filter:blur(3px);z-index:950;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px}
    .fx-dlg{width:min(1120px,100%);background:var(--panel-solid);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 30px 70px -20px rgba(0,0,0,.8);display:grid;grid-template-columns:minmax(0,1.25fr) 360px;overflow:hidden;color:var(--ink);font-family:'Hanken Grotesk',sans-serif}
    .fx-dlg .l{padding:18px 20px 16px;border-right:1px solid var(--line-2);min-width:0}
    .fx-dlg .r{padding:18px 18px 16px;background:var(--board-2);min-width:0}
    .fx-dh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .fx-dh h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px}
    .fx-dh .tag{font:800 9.5px 'IBM Plex Mono',monospace;letter-spacing:.6px;color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 45%,transparent);border-radius:6px;padding:2px 7px;text-transform:uppercase}
    .fx-dh .x{margin-left:auto;background:transparent;border:1px solid var(--line-2);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer}
    .fx-lab{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
    .fx-courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .fx-cc{position:relative;text-align:left;border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:10px 12px 10px 14px;cursor:pointer;color:var(--ink);font-family:inherit;overflow:hidden;min-width:0}
    .fx-cc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc)}
    .fx-cc b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fx-cc b i{font-style:normal;color:var(--vip)}
    .fx-cc small{display:block;color:var(--muted);font:600 11px 'IBM Plex Mono',monospace;margin-top:3px}
    .fx-cc small em{font-style:normal;color:var(--brand)}
    .fx-cc.on{box-shadow:0 0 0 2px var(--brand);background:var(--card-hi)}
    .fx-cc .pk{position:absolute;right:9px;top:9px;font:800 9px 'IBM Plex Mono',monospace;color:var(--badge-ink);background:var(--brand);border-radius:5px;padding:1px 5px}
    .fx-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .fx-f{background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:7px 11px;min-width:0}
    .fx-f label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
    .fx-f div{font:700 15px 'IBM Plex Mono',monospace;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fx-f div small{font:600 11px 'Hanken Grotesk',sans-serif;color:var(--muted);margin-left:5px}
    .fx-f.seg div{display:flex;gap:4px;margin-top:4px}
    .fx-f.seg span{flex:1;text-align:center;border:1px solid var(--line-2);border-radius:6px;font:700 12px 'IBM Plex Mono',monospace;line-height:22px;color:var(--muted)}
    .fx-f.seg span.on{background:var(--brand);color:var(--badge-ink);border-color:var(--brand)}
    .fx-players{display:flex;flex-direction:column;gap:5px}
    .fx-p{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:6px 10px}
    .fx-p .av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(145deg,var(--regular),color-mix(in srgb,var(--regular) 62%,#000))}
    .fx-p .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fx-p .nm small{display:block;font:600 10.5px 'IBM Plex Mono',monospace;color:var(--muted);font-weight:600}
    .fx-p .mbr{font:800 9.5px 'IBM Plex Mono',monospace;color:var(--vip);border:1px solid color-mix(in srgb,var(--vip) 55%,transparent);border-radius:5px;padding:1px 6px;white-space:nowrap}
    .fx-p .mbr.g{color:var(--muted);border-color:var(--line-2)}
    .fx-p .cad{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(34,197,94,.5);background:rgba(34,197,94,.08);border-radius:7px;padding:3px 8px;font-size:12px;white-space:nowrap}
    .fx-p .cad b{font:700 12px 'IBM Plex Mono',monospace}
    .fx-p .cad.need{border:1px dashed var(--vip);background:transparent;color:var(--vip);font-weight:800}
    .fx-p .cad.clash{border-color:var(--cd-red);background:rgba(239,68,68,.12);color:#fca5a5}
    .fx-p.add{border-style:dashed;color:var(--muted);font-weight:700;grid-template-columns:1fr;text-align:left;cursor:pointer}
    /* shared caddy picker (right of the players) */
    .fx-pick{margin-top:8px;border:1px solid var(--line-2);border-radius:12px;background:var(--card);overflow:hidden}
    .fx-pick .h{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .fx-pick .h .r{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--brand);font-weight:700}
    .fx-pr{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:6px 11px;border-bottom:1px solid var(--line);font-size:12.5px}
    .fx-pr:last-child{border-bottom:0}
    .fx-pr b{font:700 12.5px 'IBM Plex Mono',monospace}
    .fx-pr .st{font:600 11px 'IBM Plex Mono',monospace;color:var(--muted);white-space:nowrap}
    .fx-pr .st i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--cc);margin-right:5px;vertical-align:middle}
    .fx-pr .st.free{color:var(--brand)}.fx-pr .st.busy{color:var(--vip)}.fx-pr .st.clash{color:#fca5a5}
    .fx-pr .go{background:var(--brand);color:var(--badge-ink);border:0;border-radius:6px;font:800 11px 'Hanken Grotesk',sans-serif;padding:4px 9px;cursor:pointer}
    .fx-pr .go.no{background:transparent;border:1px solid var(--line-2);color:var(--muted);cursor:not-allowed}
    .fx-foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
    .fx-foot .hint{font-size:11.5px;color:var(--muted);font-weight:600;flex:1}
    .fx-foot .hint b{color:var(--ink)}
    .fx-btn{background:var(--brand);color:var(--badge-ink);border:1px solid var(--brand);font:800 13px 'Hanken Grotesk',sans-serif;border-radius:9px;padding:9px 16px;cursor:pointer;white-space:nowrap}
    .fx-btn.o{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
    /* brief (right): who this is — member card across the facility */
    .fx-brief h3{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .fx-mc{position:relative;border:1px solid color-mix(in srgb,var(--vip) 45%,transparent);background:linear-gradient(160deg,rgba(245,179,66,.12),rgba(245,179,66,.02) 60%);border-radius:14px;padding:12px 14px;margin-bottom:12px;overflow:hidden}
    .fx-mc .who{display:flex;align-items:center;gap:10px}
    .fx-mc .av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(145deg,var(--regular),color-mix(in srgb,var(--regular) 62%,#000))}
    .fx-mc .nm{font-weight:800;font-size:14.5px;min-width:0}
    .fx-mc .nm small{display:block;color:var(--muted);font:600 11px 'IBM Plex Mono',monospace}
    .fx-mc .tier{margin-left:auto;flex:none;text-align:right;font:800 10px 'IBM Plex Mono',monospace;color:var(--vip);letter-spacing:.4px}
    .fx-mc .tier small{display:block;font:600 9.5px 'Hanken Grotesk',sans-serif;color:var(--muted);letter-spacing:0}
    .fx-mc .cs{display:flex;gap:6px;margin-top:10px}
    .fx-mc .cs span{flex:1;border-radius:8px;border:1px solid var(--line-2);background:var(--card);padding:5px 7px;font-size:10.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden}
    .fx-mc .cs span i{width:7px;height:7px;border-radius:2px;background:var(--cc);flex:none}
    .fx-mc .cs span b{margin-left:auto;font:700 11px 'IBM Plex Mono',monospace;color:var(--ink)}
    .fx-mc .cs span.home{border-color:color-mix(in srgb,var(--vip) 55%,transparent)}
    .fx-mc .line{margin-top:9px;font-size:11.5px;color:var(--ink-2);font-weight:600}
    .fx-mc .line b{color:var(--brand)}
    .fx-hist{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
    .fx-hr{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
    .fx-hr .dt{font:600 11px 'IBM Plex Mono',monospace;color:var(--muted)}
    .fx-hr .c{display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fx-hr .c i{width:8px;height:8px;border-radius:2px;background:var(--cc);flex:none}
    .fx-hr .cd{font:600 11px 'IBM Plex Mono',monospace;color:var(--muted);white-space:nowrap}
    .fx-usual{display:flex;gap:6px;flex-wrap:wrap}
    .fx-usual button{border:1px solid rgba(34,197,94,.5);background:rgba(34,197,94,.08);color:var(--ink);border-radius:999px;padding:4px 10px;font:700 12px 'Hanken Grotesk',sans-serif;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
    .fx-usual button b{font:700 12px 'IBM Plex Mono',monospace}
    .fx-usual button small{font:600 10px 'IBM Plex Mono',monospace;color:var(--muted)}
    .fx-usual button.busy{border-color:var(--vip);background:rgba(245,179,66,.08)} .fx-usual button.busy small{color:var(--vip)}
    .fx-note{margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.45}
    .fx-note b{color:var(--ink)}
    /* ===== facility caddy desk: the real CADDIES board with a course lane colour ===== */
    #cd-board[hidden],#ins[hidden]{display:none}
    #cd-board{display:block;padding:10px 12px 90px;color:var(--ink);font-family:'Hanken Grotesk',sans-serif}
    .cd-bar.gv{background:rgba(52,211,153,.14);color:var(--course-a-header);border-color:rgba(52,211,153,.6)}
    .cd-bar.sa{background:rgba(56,189,248,.14);color:var(--course-b-header);border-color:rgba(56,189,248,.6)}
    .cd-bar.so{background:rgba(251,191,36,.14);color:var(--course-c-header);border-color:rgba(251,191,36,.6)}
    .cd-bar.out.gv,.cd-bar.out.sa,.cd-bar.out.so{box-shadow:inset 0 0 0 1px currentColor}
    .cd-bar .cb{display:inline-block;width:7px;height:7px;border-radius:2px;background:currentColor;margin-right:5px;flex:none}
    .cd-row .who .cw{margin-left:auto;display:inline-flex;gap:3px}
    .cd-row .who .cw i{width:7px;height:7px;border-radius:2px;background:var(--cc);opacity:.9}
    .cd-row .who .lp{margin-left:6px}
    .cd-lane{display:flex;gap:12px;align-items:center;padding:4px 2px 8px;font-size:11px;color:var(--muted);font-weight:700}
    .cd-lane span{display:inline-flex;align-items:center;gap:6px}
    .cd-lane span i{width:9px;height:9px;border-radius:3px;background:var(--cc)}
    .cd-lane .r{margin-left:auto;color:var(--ink-2)}
    .cd-lane .r b{color:var(--brand)}
    .cd-k.gv .v{color:var(--course-a-header)}.cd-k.sa .v{color:var(--course-b-header)}.cd-k.so .v{color:var(--course-c-header)}
    .cd-k.r .v{color:var(--cd-red)}.cd-k.g .v{color:var(--cd-green)}.cd-k.a .v{color:var(--cd-amber)}
    .cd-chip.on{border-color:var(--brand);color:var(--ink)}
    .cd-chip i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--cc);margin-right:5px;vertical-align:-1px}
    .cd-bar.mv.drag.bad{position:absolute}
    .cd-toast{position:absolute;z-index:8;background:var(--panel-solid);border:1px solid var(--cd-red);color:#fca5a5;border-radius:9px;padding:7px 11px;font:700 11.5px 'Hanken Grotesk',sans-serif;box-shadow:0 14px 30px -10px rgba(0,0,0,.8);white-space:nowrap}
    .cd-toast small{display:block;color:var(--muted);font-weight:600;margin-top:2px}
    /* ===== insights ===== */
    .ins{padding:14px 18px 90px;color:var(--ink);font-family:'Hanken Grotesk',sans-serif;max-width:1500px}
    .ins-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .ins-h h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.2px}
    .ins-h .seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--card);border:1px solid var(--line-2)}
    .ins-h .seg span{padding:0 10px;height:26px;line-height:26px;border-radius:7px;font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--muted)}
    .ins-h .seg span.on{background:var(--brand);color:var(--badge-ink)}
    .ins-h .r{margin-left:auto;font:600 11px 'IBM Plex Mono',monospace;color:var(--muted)}
    .ins-g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
    .ins-c{background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;min-width:0}
    .ins-c h3{margin:0 0 8px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
    .ins-c h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--brand);font-weight:700}
    .ins-tile .v{font:700 28px 'IBM Plex Mono',monospace;line-height:1.05}
    .ins-tile .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
    .ins-tile .l b{color:var(--brand)}
    .ins-tile .l b.w{color:var(--vip)}
    .bar-rows{display:flex;flex-direction:column;gap:7px}
    .bar-r{display:grid;grid-template-columns:118px minmax(0,1fr) 58px;gap:10px;align-items:center;font-size:12px}
    .bar-r .n{display:flex;align-items:center;gap:7px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
    .bar-r .n i{width:9px;height:9px;border-radius:3px;background:var(--cc);flex:none}
    .bar-r .t{height:14px;background:var(--line);border-radius:4px;overflow:hidden;display:flex;gap:2px}
    .bar-r .t i{display:block;height:100%;background:var(--cc);border-radius:0 4px 4px 0}
    .bar-r .v{font:700 12px 'IBM Plex Mono',monospace;text-align:right;color:var(--ink)}
    .bar-r .v small{color:var(--muted);font-weight:600}
    .stk{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 8px}
    .stk i{display:block;height:100%;background:var(--cc)}
    .lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:700}
    .lgd span{display:inline-flex;align-items:center;gap:5px}.lgd span i{width:8px;height:8px;border-radius:2px;background:var(--cc)}
    .lgd span b{color:var(--ink);font-family:'IBM Plex Mono',monospace}
    .seg-list{display:flex;flex-direction:column;gap:6px}
    .seg-r{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:10px;align-items:center;border:1px solid var(--line-2);border-radius:10px;padding:8px 11px;background:var(--board-2)}
    .seg-r .w{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .seg-r .w small{display:block;color:var(--muted);font-weight:600;font-size:11px;white-space:normal}
    .seg-r .w small em{font-style:normal;color:var(--brand)}
    .seg-r .n{font:700 16px 'IBM Plex Mono',monospace;text-align:right}
    .seg-r .n small{display:block;font:600 9.5px 'Hanken Grotesk',sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    .seg-r button{background:var(--brand);color:var(--badge-ink);border:0;border-radius:7px;font:800 11px 'Hanken Grotesk',sans-serif;padding:6px 10px;cursor:pointer;white-space:nowrap}
    .seg-r button.o{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
    .hm{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:3px;font:600 10px 'IBM Plex Mono',monospace;color:var(--muted)}
    .hm .hd{text-align:center;padding-bottom:2px}
    .hm .rl{display:flex;align-items:center}
    .hm .c{height:18px;border-radius:3px;background:color-mix(in srgb,var(--cc) calc(var(--p) * 1%),var(--board-2))}
    .cad-row{display:grid;grid-template-columns:50px 110px minmax(0,1fr) 44px 92px;gap:8px;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}
    .cad-row:last-child{border-bottom:0}
    .cad-row.hd{font:700 9.5px 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    .cad-row b{font:700 12px 'IBM Plex Mono',monospace}
    .cad-row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cad-row .sp{display:flex;gap:2px;height:10px;border-radius:3px;overflow:hidden}
    .cad-row .sp i{display:block;height:100%;background:var(--cc)}
    .cad-row .rt{font:700 12px 'IBM Plex Mono',monospace;color:var(--vip)}
    .cad-row .mono{font:600 11px 'IBM Plex Mono',monospace;color:var(--muted);text-align:right}
    /* ===== phone ===== */
    @media (max-width:640px){
      .top-header-bar{flex-wrap:wrap;height:auto;min-height:0;padding:6px 10px;gap:6px 8px;justify-content:space-between}
      .header-center,.lang-select,#lang-select,.ts-thm,#settings-btn,.header-btn{display:none!important}
      .header-right{margin-left:auto}
      .controls-row{padding:7px 10px;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
      .fx-rail{height:40px}.fx-rail button{padding:0 9px;height:32px;gap:6px}.fx-rail .m{display:none}.fx-rail button .f{display:none}
      .fx-rail button .nm{font-size:12px}
      .control-group,.fx-kpis .fx-k:not(.tot){display:none}
      .fx-kpis{padding:0 10px}.fx-k{margin-right:0;border-right:0;padding:7px 0}
      .today-btn.primary{height:32px;font-size:12px;order:-1;flex:none}
      .fx-sub{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .fx-others{padding:6px 10px}
      :root{--tcol:44px}
      html.ts-day .grid-header-cell{padding:5px 4px 4px}
      html.ts-day .gh-name{font-size:11px;gap:4px}
      html.ts-day .gh-count{display:none}
      html.ts-day .pill{padding:0 4px 0 6px;gap:3px}
      html.ts-day .pill .pill-name{font-size:11px}
      html.ts-day .pill .mb{display:none}
    }
  </style>
</head>
<body>
<div class="teesheet-container">
  <div class="top-header-bar">
    <div class="header-left">
      <div class="logo-section">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#22c55e" stroke-width="2"/><path d="M8 12l3 3 5-6" stroke="#22c55e" stroke-width="2" fill="none"/></svg>
        <span class="course-name-display" id="course-name-display">Barelona Golf<span class="fx-sub" id="fx-sub">3 COURSES · ONE TEE SHEET · ONE CADDY ROSTER</span></span>
      </div>
      <div class="live-badge"><div class="live-dot"></div><span>LIVE TEE SHEET</span></div>
    </div>
    <div class="header-center">
      <button class="date-nav-btn">‹</button>
      <div class="date-display-large">Friday, 9 October 2026</div>
      <button class="date-nav-btn">›</button>
    </div>
    <div class="header-right">
      <div class="current-time-display">09:42</div>
      <select id="lang-select" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;"><option>🇬🇧 EN</option></select>
      <div class="ts-thm"><button type="button">WHITE</button><button type="button" class="on">DARK</button><button type="button">GLASS</button></div>
      <button class="header-btn" id="settings-btn">⚙ Settings</button>
    </div>
  </div>

  <div class="main-content">
    <div class="controls-row" id="controls-row">
      <div class="fx-rail" id="fx-rail"></div>
      <div class="control-group">
        <label>DATE</label>
        <div class="date-control">
          <button>‹</button><input type="date" value="2026-10-09"><button>›</button>
          <button class="today-btn">Today</button>
          <button class="cal-nav-btn">📅</button>
          <button class="today-btn" id="fx-cad-btn">Caddies</button>
          <button class="today-btn">Print sheet</button>
          <button class="today-btn">Societies <span class="n">2</span></button>
          <button class="today-btn">App bookings <span class="n">5</span></button>
          <button class="today-btn">Traffic</button>
          <button class="today-btn" id="fx-ins-btn">Insights</button>
        </div>
      </div>
      <span class="grow"></span>
      <button class="today-btn primary" id="fx-new">＋ Tee time</button>
    </div>
    <div class="fx-kpis" id="fx-kpis"></div>
    <div class="fx-others" id="fx-others" hidden></div>

    <div class="teesheet-grid" id="teesheet-grid">
      <div class="grid-header" id="grid-header"></div>
      <div id="grid-body"></div>
    </div>
    <div id="cd-board" hidden></div>
    <div id="ins" class="ins" hidden></div>
  </div>
</div>

<div id="ts-qf" role="search">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 015.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg>
  <input id="ts-qf-input" type="text" placeholder="Quick find — golfer, caddy, group, any course" aria-label="Quick find">
  <span id="ts-qf-count"></span>
</div>

<div id="fx-dialog" hidden></div>

<script>
(function(){ try {
  // ---------- seed (made-up names; the three courses are the real facility) ----------
  const Q = new URLSearchParams(location.search);
  const VIEW = Q.get('view') || 'all';
  const COURSES = [
    { k:'gv', letter:'A', badge:'GV', name:'Green Valley', full:'Green Valley Rayong CC', star:true,  fill:.72, cc:'var(--course-a-header)' },
    { k:'sa', letter:'B', badge:'SA', name:'St Andrews', full:'St. Andrews 2000 GC', star:false, fill:.58, cc:'var(--course-b-header)' },
    { k:'so', letter:'C', badge:'SO', name:'Silky Oak', full:'Silky Oak Country Club', star:false, fill:.41, cc:'var(--course-c-header)' },
  ];
  const BY = Object.fromEntries(COURSES.map(c => [c.k, c]));
  const START = 6*60, END = 18*60, STEP = 10, NOW = 9*60+42, BLOCK = 270;
  let seed = 20261009; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const pick = a => a[Math.floor(rnd()*a.length)];
  const SUR = ['Golfer','Player','Member','Guest','Visitor'], INI = 'ABCDEFGHJKLMNPRSTVW';
  let gi = 0; const gName = () => 'Test ' + pick(SUR) + ' ' + INI[gi++ % INI.length] + (gi > INI.length ? Math.ceil(gi/INI.length) : '');
  const NICK = ['Noi','Fon','May','Ploy','Nan','Bee','Som','Mint','Pim','Joy','Aom','Kae','Nok','Tuk','Gift','Pui','Nam','Wan','Oil','Jib','Pat','Tan','Ying','Lek'];
  const ROSTER = []; for (let n=1; n<=250; n++) ROSTER.push({ id:'c'+n, num:n, name:'Test ' + NICK[(n-1)%NICK.length] + (n>NICK.length ? ' '+Math.ceil(n/NICK.length) : ''), jobs:[], off:(n%23===0 || n%37===0) });
  const freeCaddy = (s, e) => ROSTER.find(c => !c.off && c.jobs.every(j => s >= j.e || e <= j.s));
  const hhmm = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
  const BOOK = [];   // {course, t, type, name, players, cads:[], member, need}
  COURSES.forEach(c => {
    for (let m = START; m <= END; m += STEP) {
      const peak = m >= 6*60+30 && m <= 9*60 ? .28 : m >= 12*60+30 && m <= 14*60 ? .12 : 0;
      if (rnd() > c.fill + peak - .1) continue;
      const r = rnd();
      let type = r < .08 ? 'vip' : r < .18 ? 'app' : 'regular';
      const players = type === 'vip' ? 2 + Math.floor(rnd()*2) : 1 + Math.floor(rnd()*4);
      const member = c.k === 'gv' ? rnd() < .5 : rnd() < .3;
      BOOK.push({ course:c.k, t:m, type, name:gName(), players, cads:[], member, need:0, want: rnd() < .97 ? players : players - 1 });
    }
  });
  // society block at Green Valley 07:00–07:30 (4 groups), one at St Andrews 11:00 (3 groups)
  const SOC = [{course:'gv', from:7*60, n:4, name:'ZZ Test Society'}, {course:'sa', from:11*60, n:3, name:'ZZ Test Golf Group'}];
  SOC.forEach(s => { for (let i=0;i<s.n;i++){ const t = s.from + i*STEP; const idx = BOOK.findIndex(b => b.course===s.course && b.t===t); if (idx>=0) BOOK.splice(idx,1);
    BOOK.push({ course:s.course, t, type:'society', name:s.name + ' · G' + (i+1), players:4, cads:[], member:false, need:0, want:4, groupIndex:i, groupTotal:s.n }); } });
  // ONE rotation across the facility: the caddy back at the yard longest goes out next, whichever course asks
  const lastEnd = c => c.jobs.length ? Math.max(...c.jobs.map(j=>j.e)) : 0;
  const nextOut = (s, e) => ROSTER.filter(c => !c.off && c.jobs.every(j => s >= j.e || e <= j.s)).sort((a,b) => (lastEnd(a)-lastEnd(b)) || a.num-b.num)[0];
  BOOK.slice().sort((a,b)=>a.t-b.t || a.course.localeCompare(b.course)).forEach(b => {
    for (let i=0;i<b.want;i++){ const f = nextOut(b.t, b.t+BLOCK); if (!f) break; f.jobs.push({s:b.t,e:b.t+BLOCK,course:b.course,golfer:b.name.replace(/ · G\d/,'')}); b.cads.push(f); }
    b.need = b.players - b.cads.length;
  });
  // a few afternoon jobs still waiting on a caddy (the phone-in and app bookings that arrived after the morning send-out)
  BOOK.filter(b => b.t >= 13*60 && b.type !== 'society' && b.cads.length).filter((b,i) => i % 9 === 0).slice(0,6).forEach(b => { const c = b.cads.pop(); c.jobs = c.jobs.filter(j => !(j.s===b.t && j.course===b.course)); b.need = b.players - b.cads.length; });
  // open times the course puts up (v1445), a hot deal (v1219)
  BOOK.push({ course:'so', t:14*60+20, type:'opentime', name:'OPEN', players:0, cads:[], member:false, need:0 });
  BOOK.push({ course:'so', t:14*60+30, type:'opentime', name:'OPEN', players:0, cads:[], member:false, need:0 });
  BOOK.push({ course:'sa', t:15*60+10, type:'hotdeal', name:'Twilight deal', players:0, cads:[], member:false, need:0 });

  const nRows = Math.floor((END-START)/STEP) + 1;
  const stats = {};
  COURSES.forEach(c => { const bs = BOOK.filter(b => b.course===c.k && b.type!=='opentime' && b.type!=='hotdeal'); stats[c.k] = { booked: bs.length, players: bs.reduce((n,b)=>n+b.players,0), need: bs.reduce((n,b)=>n+b.need,0), fill: Math.round(bs.length/nRows*100) }; });
  const TOT = { booked: Object.values(stats).reduce((n,s)=>n+s.booked,0), players: Object.values(stats).reduce((n,s)=>n+s.players,0), need: Object.values(stats).reduce((n,s)=>n+s.need,0) };
  TOT.fill = Math.round(TOT.booked / (nRows*3) * 100);
  const onDuty = ROSTER.filter(c=>!c.off).length, outNow = ROSTER.filter(c => c.jobs.some(j => j.s <= NOW && NOW < j.e)).length;

  // ---------- rail + KPIs ----------
  const cur = ['gv','sa','so'].includes(VIEW) ? VIEW : 'all';
  document.getElementById('fx-rail').innerHTML =
    `<button type="button" class="all${cur==='all'?' on':''}"><span class="nm">ALL 3</span><span class="f">${TOT.fill}%</span></button>` +
    COURSES.map(c => `<button type="button" class="${cur===c.k?' on':''}" style="--cc:${c.cc}"><span class="d"></span><span class="nm">${c.name}${c.star?'<i>★</i>':''}</span><span class="m"><i style="width:${stats[c.k].fill}%"></i></span><span class="f">${stats[c.k].fill}%</span></button>`).join('');
  const kpi = (c, s, tot) => `<div class="fx-k${tot?' tot':''}" style="--cc:${c.cc||'var(--brand)'}"><span class="d"></span><div class="t">${c.name}${c.star?' ★':''}<small>${c.sub||''}</small></div><div class="v"><span>${s.booked}<b>Booked</b></span>${tot?`<span class="g">${nRows*3-s.booked}<b>Open</b></span><span>${s.players}<b>Players</b></span>`:''}<span>${s.fill}%<b>Fill</b></span>${s.need?`<span class="cad warn">${s.need} ${s.need===1?'caddy':'caddies'} short</span>`:`<span class="cad">caddies ✓</span>`}</div></div>`;
  document.getElementById('fx-kpis').innerHTML = kpi({name:'Facility', sub:'all three courses'}, TOT, true) + COURSES.map(c => kpi({name:c.name, star:c.star, cc:c.cc, sub:'18 holes'}, stats[c.k])).join('')
    + `<div class="fx-k" style="--cc:var(--brand)"><span class="d"></span><div class="t">Caddies<small>one roster</small></div><div class="v"><span>${onDuty}<b>On duty</b></span><span class="g">${onDuty-outNow}<b>Free</b></span></div></div>`;

  // ---------- grid ----------
  const cols = cur === 'all' ? COURSES : [BY[cur]];
  const tsInitials = n => n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  function pill(b) {
    const c = BY[b.course];
    let typeClass = b.type, tag = '', meta = `<span class="m">${b.players||1}</span>`;
    const cad = b.cads.length ? (b.cads.length === 1 ? 'C' + b.cads[0].num : String(b.cads.length)) : '';
    if (cad) meta += `<span class="m">⛳${cad}</span>`;
    if (b.need) meta += `<span class="m" style="color:var(--vip)">+${b.need}</span>`;
    if (b.type==='vip') tag='VIP'; else if (b.type==='society') tag='SOC'; else if (b.type==='hotdeal') tag='DEAL'; else if (b.type==='opentime') meta='';
    if (b.type==='app') tag='PAID';
    const seq = b.groupTotal ? `<span style="opacity:.6;font-size:10px;font-weight:700;">${b.groupIndex+1}/${b.groupTotal}</span> ` : '';
    const mb = b.member ? '<span class="mb">MBR</span>' : '';
    const name = b.type==='society' ? b.name.replace(/ · G\d/,'') : b.name;
    return `<div class="pill ${typeClass}" data-course="${c.k}"><div class="pill-av">${tsInitials(name)}</div><div class="pill-body"><div class="pill-name">${seq}${name}</div><div class="pill-info">${meta}</div>${mb}</div>${tag?`<div class="pill-tag">${tag}</div>`:''}</div>`;
  }
  let body = '', nowDone = false;
  for (let m = START; m <= END; m += STEP) {
    const hour = m === START || Math.floor(m/60) !== Math.floor((m-STEP)/60);
    if (!nowDone && m > NOW) { body += '<div class="ts-nowrow"></div>'; nowDone = true; }
    let row = `<div class="grid-row${hour?' hour-row':''}" data-time="${hhmm(m)}"><div class="time-cell">${hhmm(m)}</div>`;
    cols.forEach(c => { const bs = BOOK.filter(b => b.course===c.k && b.t===m); row += `<div class="slot course-${c.letter.toLowerCase()}" data-time="${hhmm(m)}" data-course="${c.k}">${bs.map(pill).join('')}</div>`; });
    body += row + '</div>';
  }
  const gb = document.getElementById('grid-body'); gb.innerHTML = body;
  document.documentElement.style.setProperty('--cols', cols.length);
  const w = document.querySelector('.main-content').clientWidth;
  const per = 50 + cols.length*100 + 12;
  const blocks = Math.max(1, Math.min(cols.length>1?3:4, Math.floor((w+12)/per), Math.ceil(nRows/12)));
  document.documentElement.style.setProperty('--blocks', blocks);
  let head = `<div class="grid-header-cell time-header">TIME</div>` + cols.map(c => `<div class="grid-header-cell course-${c.letter.toLowerCase()}"><div class="gh-top"><div class="gh-name"><span class="gh-badge">${c.badge}</span>${c.name}${c.star?' <i>★</i>':''}</div><div class="gh-count"><b>${stats[c.k].booked}</b>/${nRows}</div></div><div class="gh-bar"><i style="width:${stats[c.k].fill}%"></i></div></div>`).join('');
  document.getElementById('grid-header').innerHTML = `<div class="gh-block">${head}</div>`.repeat(blocks);
  document.getElementById('ts-qf-count').textContent = '';

  if (cur !== 'all') {
    const c = BY[cur];
    document.getElementById('fx-sub').textContent = (c.full + ' · BARELONA GOLF').toUpperCase();
    const o = document.getElementById('fx-others'); o.hidden = false;
    o.innerHTML = '<span class="nsl">Other courses now</span>' + COURSES.filter(x => x.k!==cur).map(x => `<button type="button" style="--cc:${x.cc}"><span class="d"></span>${x.name} <b>${stats[x.k].fill}%</b> · ${nRows-stats[x.k].booked} open${stats[x.k].need?` · <em>${stats[x.k].need} ${stats[x.k].need===1?'caddy':'caddies'} needed</em>`:''} · next free ${hhmm(nextFree(x.k))}</button>`).join('')
      + `<button type="button" style="--cc:var(--brand)"><span class="d"></span>All 3 <b>${TOT.fill}%</b></button>`;
  }
  function nextFree(k) { for (let m = Math.max(NOW+STEP, START); m <= END; m += STEP) if (!BOOK.some(b => b.course===k && b.t===m)) return m; return END; }

  // ---------- master booking dialog ----------
  if (VIEW === 'book') {
    const T = 12*60+30;
    const nf = k => hhmm(nextFree(k));
    const at = (c, m) => c.jobs.find(j => j.s <= m && m < j.e);
    const inBlock = (c, m) => c.jobs.find(j => Math.abs(j.s - m) < BLOCK);
    const picks = ROSTER.filter(c=>!c.off).slice().sort((a,b)=> (inBlock(a,T)?1:0)-(inBlock(b,T)?1:0) || (lastEnd(a)-lastEnd(b)) || a.num-b.num).filter((c,i,arr)=> i<4 || (inBlock(c,T) && arr.slice(0,i).filter(x=>inBlock(x,T)).length<2));
    const rowOf = c => { const j = inBlock(c, T); const o = at(c, NOW);
      if (!j) return `<div class="fx-pr"><b>#${c.num}</b><span>${c.name}</span><span class="st free"><i style="--cc:var(--brand)"></i>free · at the yard</span><button class="go">Book</button></div>`;
      const cc = BY[j.course]; const ok = false;
      return `<div class="fx-pr"><b>#${c.num}</b><span>${c.name}</span><span class="st clash"><i style="--cc:${cc.cc}"></i>${cc.name} ${hhmm(j.s)} · back ${hhmm(j.e)}</span><button class="go no">Busy</button></div>`; };
    const pickRows = picks.map(rowOf).join('');
    const usual = [ROSTER.find(c=>!c.off && !inBlock(c,T) && c.num>10) || ROSTER[0], ROSTER.find(c=>!c.off && inBlock(c,T) && inBlock(c,T).course!=='sa') || ROSTER[1]];
    const uBtn = c => { const j = inBlock(c, T); return `<button type="button" class="${j?'busy':''}"><b>#${c.num}</b>${c.name}<small>${j ? BY[j.course].name + ' till ' + hhmm(j.e) : 'free · usual caddy'}</small></button>`; };
    document.getElementById('fx-dialog').hidden = false;
    document.getElementById('fx-dialog').innerHTML = `<div class="fx-dim"><div class="fx-dlg">
      <div class="l">
        <div class="fx-dh"><h2>New tee time</h2><span class="tag">Master control · any course</span><button class="x">✕</button></div>
        <div class="fx-lab">Course — the facility, not one sheet</div>
        <div class="fx-courses">
          ${COURSES.map((c,i) => `<button type="button" class="fx-cc${i===1?' on':''}" style="--cc:${c.cc}"><b>${c.name}${c.star?' <i>★</i>':''}</b><small>${stats[c.k].fill}% full · next free <em>${nf(c.k)}</em> · ${stats[c.k].need?stats[c.k].need+(stats[c.k].need===1?' caddy short':' caddies short'):'caddies ✓'}</small>${i===1?'<span class="pk">PICKED</span>':''}</button>`).join('')}
        </div>
        <div class="fx-lab">When</div>
        <div class="fx-row">
          <div class="fx-f"><label>Date</label><div>Fri 9 Oct</div></div>
          <div class="fx-f"><label>Tee time</label><div>${hhmm(T)}<small>St Andrews · 1st tee</small></div></div>
          <div class="fx-f seg"><label>Players</label><div><span>1</span><span>2</span><span class="on">3</span><span>4</span></div></div>
          <div class="fx-f seg"><label>Type</label><div><span class="on">REG</span><span>VIP</span><span>SOC</span></div></div>
        </div>
        <div class="fx-lab">Players · caddies from the shared roster</div>
        <div class="fx-players">
          <div class="fx-p"><span class="av">TM</span><span class="nm">Test Member A<small>Member · all three courses · home Green Valley</small></span><span class="mbr">MEMBER RATE</span><span class="cad"><b>#${usual[0].num}</b> ${usual[0].name}</span></div>
          <div class="fx-p"><span class="av" style="background:linear-gradient(145deg,var(--society),color-mix(in srgb,var(--society) 62%,#000))">TG</span><span class="nm">Test Guest B<small>Guest of the member · played Silky Oak twice</small></span><span class="mbr g">GUEST</span><span class="cad clash"><b>#${usual[1].num}</b> at ${BY[(inBlock(usual[1],T)||{course:'gv'}).course].name} till ${hhmm((inBlock(usual[1],T)||{e:T}).e)} · swap</span></div>
          <div class="fx-p"><span class="av" style="background:linear-gradient(145deg,var(--vip),color-mix(in srgb,var(--vip) 62%,#000))">TV</span><span class="nm">Test Visitor C<small>First visit to the facility</small></span><span class="mbr g">VISITOR</span><span class="cad need">Needs a caddy</span></div>
          <div class="fx-p add">＋ Add a player (search all three courses' books)</div>
        </div>
        <div class="fx-pick"><div class="h">Shared caddy roster · free at ${hhmm(T)} on any course<span class="r">${ROSTER.filter(c=>!c.off && !inBlock(c,T)).length} free · ${ROSTER.filter(c=>!c.off && inBlock(c,T)).length} out at a sister course</span></div>${pickRows}</div>
        <div class="fx-foot"><span class="hint">A caddy holds <b>4 h 30</b> across all three courses. The database refuses a second job in that window, whichever sheet books it.</span><button class="fx-btn o">Hold slot</button><button class="fx-btn">Book St Andrews ${hhmm(T)} · 2 caddies alerted on LINE</button></div>
      </div>
      <div class="r fx-brief">
        <h3>Who this is</h3>
        <div class="fx-mc"><div class="who"><span class="av">TM</span><span class="nm">Test Member A<small>MBR-0412 · since Mar 2024 · to Mar 2027</small></span><div class="tier">FACILITY MEMBER<small>plays all three</small></div></div>
          <div class="cs">${COURSES.map(c=>`<span class="${c.star?'home':''}" style="--cc:${c.cc}"><i></i>${c.badge}<b>${c.k==='gv'?31:c.k==='sa'?12:4}</b></span>`).join('')}</div>
          <div class="line">47 rounds this year across the facility · <b>member rate applies here</b> · usual day Friday 12:30</div></div>
        <h3>Last at the facility</h3>
        <div class="fx-hist">
          <div class="fx-hr"><span class="dt">Oct 2</span><span class="c" style="--cc:${BY.gv.cc}"><i></i>Green Valley · 10:10</span><span class="cd">#14 · 3 players</span></div>
          <div class="fx-hr"><span class="dt">Sep 25</span><span class="c" style="--cc:${BY.gv.cc}"><i></i>Green Valley · 09:50</span><span class="cd">#14 · 4 players</span></div>
          <div class="fx-hr"><span class="dt">Sep 19</span><span class="c" style="--cc:${BY.so.cc}"><i></i>Silky Oak · 13:30</span><span class="cd">#28 · 2 players</span></div>
          <div class="fx-hr"><span class="dt">Sep 11</span><span class="c" style="--cc:${BY.sa.cc}"><i></i>St Andrews · 10:00</span><span class="cd">#14 · 3 players</span></div>
        </div>
        <h3>Usual caddies · one tap</h3>
        <div class="fx-usual">${usual.map(uBtn).join('')}</div>
        <h3 style="margin-top:12px">Usual partners</h3>
        <div class="fx-usual"><button type="button"><b>8×</b>Test Guest B</button><button type="button"><b>5×</b>Test Player D</button><button type="button"><b>3×</b>Test Member E</button></div>
        <div class="fx-note"><b>Never played St Andrews on a weekday.</b> Flag for marketing: weekday St Andrews member offer.</div>
      </div>
    </div></div>`;
  }

  // ---------- facility caddy desk (board mode) ----------
  if (VIEW !== 'all' && !['gv','sa','so'].includes(VIEW)) { document.getElementById('teesheet-grid').style.display = 'none'; document.getElementById('ts-qf').style.display = 'none'; }
  if (VIEW === 'desk') {
    const S0 = 6*60, E0 = 18*60+30, span = E0 - S0;
    const x = m => ((m-S0)/span*100).toFixed(3)+'%', wd = (a,b) => ((Math.min(b,E0)-a)/span*100).toFixed(3)+'%';
    let lines='', labels=''; for (let m=S0; m<=E0; m+=60){ lines += `<i class="hl" style="left:${x(m)}"></i>`; if (m<E0) labels += `<span class="lb" style="left:${x(m)}">${hhmm(m)}</span>`; }
    const stOf = c => c.off ? 'off' : c.jobs.some(j => j.s<=NOW && NOW<j.e) ? 'out' : c.jobs.some(j => j.s > NOW) ? 'bkd' : 'free';
    const rk = {out:0,bkd:1,free:2,off:4};
    const order = ROSTER.slice().sort((a,b)=> rk[stOf(a)]-rk[stOf(b)] || a.num-b.num);
    const open = []; BOOK.filter(b => b.need && b.t > NOW - 30).forEach(b => open.push({ s:b.t, course:b.course, golfer:b.name.replace(/ · G\d/,''), n:b.need }));
    const bar = j => { const done = j.e <= NOW, out = j.s <= NOW && NOW < j.e; const c = BY[j.course];
      return `<button type="button" class="cd-bar ${done?'done':out?'out':'bkd'} ${j.course}" style="left:${x(j.s)};width:${wd(j.s,j.e)}"><span class="cb"></span>${done?'✓ ':''}${hhmm(j.s)} · ${c.name}${j.golfer?' · '+j.golfer:''}${out?' · back '+hhmm(j.e):''}</button>`; };
    const lanes=[]; open.sort((a,b)=>a.s-b.s).forEach(j => { let L = lanes.find(l => l[l.length-1].s + 100 <= j.s); if (!L){L=[];lanes.push(L);} L.push(j); });
    const openRows = lanes.map((L,i)=>`<div class="cd-row opn"><div class="who">${i===0?`<span>⚠ Need</span><span class="lp">${open.reduce((n,j)=>n+j.n,0)} across 3 courses</span>`:''}</div><div class="trk">${lines}${L.map(j=>`<button type="button" class="cd-bar open mv ${j.course}" style="left:${x(j.s)};width:${wd(j.s,j.s+95)}"><span class="cb"></span>${hhmm(j.s)} · ${BY[j.course].name} · ${j.golfer} · ${j.n} needed</button>`).join('')}</div><div class="fee"></div></div>`).join('');
    const rows = order.slice(0, 34).map(c => { const st = stOf(c); const courses = [...new Set(c.jobs.map(j=>j.course))];
      const inner = c.off ? '<span class="cd-bar dayoff">Day off</span>' : c.jobs.map(bar).join('');
      const fee = c.jobs.length ? '฿' + (c.jobs.length*400).toLocaleString() : '—';
      return `<div class="cd-row"><div class="who"><span class="dot ${st==='out'?'out':st==='bkd'?'bkd':st==='free'?'free':''}"></span><b>#${c.num}</b><span class="nm">${c.name}</span><span class="cw">${courses.map(k=>`<i style="--cc:${BY[k].cc}" title="${BY[k].name}"></i>`).join('')}</span><span class="lp">${c.jobs.length} loop${c.jobs.length===1?'':'s'}</span></div><div class="trk">${lines}${inner}</div><div class="fee">${fee}</div></div>`; }).join('');
    // the drag that the database refuses: #14 dragged onto a Silky Oak 11:10 job while she is at Green Valley 07:00–11:30
    const c14 = order.slice(0,34).find(c => c.jobs.some(j => j.s <= NOW && NOW < j.e && j.e > 11*60)) || ROSTER[13]; const j14 = c14.jobs.find(j => j.s <= NOW && NOW < j.e) || c14.jobs[0];
    const r14 = order.slice(0,34).indexOf(c14); const ghost = `<div class="cd-toast" style="left:calc(var(--cd-who) + (100% - var(--cd-who) - var(--cd-fee)) * ${((j14.e+20-S0)/span).toFixed(4)});top:${26 + 30*lanes.length + 32*Math.max(0,r14) + 34}px">✕ #${c14.num} is at ${BY[j14.course].name} ${hhmm(j14.s)}–${hhmm(j14.e)}<small>dragged onto Silky Oak ${hhmm(j14.e+20)} · one caddy, one job at a time, across all three courses · refused by the database, not the screen</small></div>`;
    const k = (v,l,cls) => `<div class="cd-k ${cls||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
    const byC = COURSES.map(c => k(ROSTER.filter(r => r.jobs.some(j=>j.course===c.k && j.s<=NOW && NOW<j.e)).length, 'Out at ' + c.name, c.k)).join('');
    const nowX = `<div class="cd-now" style="left:calc(var(--cd-who) + (100% - var(--cd-who) - var(--cd-fee)) * ${((NOW-S0)/span).toFixed(4)})"><span>${hhmm(NOW)}</span></div>`;
    const b = document.getElementById('cd-board'); b.hidden = false;
    b.innerHTML = `<div class="cd-btool"><div class="cd-search"><span class="ic">⌕</span><input id="cd-q-board" type="search" placeholder="Caddy number, name, or a golfer on any course"></div>
        <button class="cd-chip on">All <em>${ROSTER.length}</em></button><button class="cd-chip">Free <em>${ROSTER.filter(c=>stOf(c)==='free'||stOf(c)==='bkd').length}</em></button><button class="cd-chip">Out <em>${ROSTER.filter(c=>stOf(c)==='out').length}</em></button><button class="cd-chip">Day off <em>${ROSTER.filter(c=>c.off).length}</em></button>
        <span style="width:1px;height:20px;background:var(--line-2)"></span>
        ${COURSES.map(c=>`<button class="cd-chip" style="--cc:${c.cc}"><i></i>${c.name}</button>`).join('')}
        <span class="sp"></span><button class="cd-btn">Fill all open jobs from the queue</button><button class="cd-btn o">Caddy Desk</button></div>
      <div class="cd-kpis wide">${k(outNow,'Out now · of '+onDuty,'a')}${k(onDuty-outNow,'Free','g')}${k(open.reduce((n,j)=>n+j.n,0),'Needed', open.length?'r':'')}${byC}${k('฿'+(ROSTER.reduce((n,c)=>n+c.jobs.length,0)*400).toLocaleString(),'Fees today · all courses')}</div>
      <div class="cd-lane">${COURSES.map(c=>`<span style="--cc:${c.cc}"><i></i>${c.name}</span>`).join('')}<span class="r">Rotation: <b>one queue</b> · next out #${order.find(c=>stOf(c)==='free')?.num ?? '—'} · a caddy returns to the yard, not to a course</span></div>
      <div class="cd-tl"><div class="cd-in"><div class="cd-row hd"><div class="who">Caddy · ${ROSTER.length} on the facility roster</div><div class="trk">${labels}</div><div class="fee">Fees</div></div>${openRows}${rows}${nowX}${ghost}</div></div>`;
  }

  // ---------- insights (marketing) ----------
  if (VIEW === 'insights') {
    const I = document.getElementById('ins'); I.hidden = false;
    const br = (c, v, max, suf) => `<div class="bar-r" style="--cc:${c.cc}"><span class="n"><i></i>${c.name}${c.star?' ★':''}</span><span class="t"><i style="width:${Math.round(v/max*100)}%"></i></span><span class="v">${v.toLocaleString()}${suf?`<small> ${suf}</small>`:''}</span></div>`;
    const rounds = {gv:2184, sa:1402, so:933};
    const dows = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const heat = { gv:[38,42,51,55,88,100,96], sa:[25,30,41,46,72,90,85], so:[14,18,22,30,54,76,70] };
    const tile = (v,l,sub) => `<div class="ins-c ins-tile" style="grid-column:span 2"><div class="v">${v}</div><div class="l">${l}</div>${sub?`<div class="l">${sub}</div>`:''}</div>`;
    I.innerHTML = `<div class="ins-h"><h2>Facility insights</h2><span class="seg"><span>30 D</span><span class="on">90 D</span><span>YEAR</span></span><span class="seg"><span class="on">ALL 3</span>${COURSES.map(c=>`<span>${c.badge}</span>`).join('')}</span><span class="r">From bookings, caddy jobs and the golfer's rounds at the three courses · updated live</span></div>
    <div class="ins-g">
      ${tile('1,912','Golfers played here <b>90 d</b>','<b>+9%</b> vs prior 90 d')}
      ${tile('412','Play <b>2+ courses</b>','22% of golfers · the facility habit')}
      ${tile('286','Members','<b>71</b> not seen in 30 d')}
      ${tile('4,519','Rounds · all courses','Green Valley <b>48%</b>')}
      ${tile('3,870','Caddy loops','<b>96%</b> of players took a caddy')}
      ${tile('฿1.55M','Caddy fees','<b class="w">฿38k</b> unpaid')}
      <div class="ins-c" style="grid-column:span 4"><h3>Rounds by course · 90 d<span class="r">members vs guests</span></h3><div class="bar-rows">${COURSES.map(c=>br(c,rounds[c.k],2184)).join('')}</div>
        <div class="stk" style="margin-top:12px"><i style="--cc:var(--brand);width:46%"></i><i style="--cc:var(--society);width:38%"></i><i style="--cc:var(--muted);width:16%"></i></div><div class="lgd"><span style="--cc:var(--brand)"><i></i>Members <b>46%</b></span><span style="--cc:var(--society)"><i></i>Guests of members <b>38%</b></span><span style="--cc:var(--muted)"><i></i>Visitors <b>16%</b></span></div></div>
      <div class="ins-c" style="grid-column:span 4"><h3>When they play · fill by weekday<span class="r">% of the busiest cell</span></h3><div class="hm"><span></span>${dows.map(d=>`<span class="hd">${d}</span>`).join('')}${COURSES.map(c=>`<span class="rl" style="color:var(--ink-2)">${c.badge}</span>${heat[c.k].map(p=>`<span class="c" style="--cc:${c.cc};--p:${p}" title="${p}%"></span>`).join('')}`).join('')}</div>
        <div class="fx-note" style="margin-top:10px">Weekdays at <b>Silky Oak</b> run under a third full. That is the promo slot.</div></div>
      <div class="ins-c" style="grid-column:span 4"><h3>Where golfers cross over<span class="r">of golfers who played 2+ courses</span></h3><div class="bar-rows">
        <div class="bar-r" style="--cc:var(--brand)"><span class="n"><i></i>GV → St Andrews</span><span class="t"><i style="width:100%"></i></span><span class="v">231</span></div>
        <div class="bar-r" style="--cc:var(--brand)"><span class="n"><i></i>GV → Silky Oak</span><span class="t"><i style="width:58%"></i></span><span class="v">134</span></div>
        <div class="bar-r" style="--cc:var(--brand)"><span class="n"><i></i>St A → Silky Oak</span><span class="t"><i style="width:41%"></i></span><span class="v">95</span></div>
        <div class="bar-r" style="--cc:var(--vip)"><span class="n"><i></i>All three</span><span class="t"><i style="width:27%"></i></span><span class="v">62</span></div></div>
        <div class="fx-note" style="margin-top:10px">Green Valley is the door. <b>1 in 2</b> Green Valley regulars have never played Silky Oak.</div></div>
      <div class="ins-c" style="grid-column:span 7"><h3>Promotion targets · built from the three books<span class="r">one tap sends an offer to their app + LINE</span></h3><div class="seg-list">
        <div class="seg-r"><span class="w">Green Valley regulars who never played Silky Oak<small>3+ GV rounds in 90 d · 0 Silky Oak rounds ever · <em>weekday twilight at Silky Oak, caddy included</em></small></span><span class="n">318<small>golfers</small></span><button>Send offer</button></div>
        <div class="seg-r"><span class="w">Members not seen in 30 days<small>valid membership · no round at any course since Sep 9 · <em>welcome-back tee time, member's usual caddy held</em></small></span><span class="n">71<small>members</small></span><button>Send offer</button></div>
        <div class="seg-r"><span class="w">Weekend-only golfers at St Andrews<small>5+ rounds, all Sat/Sun · <em>weekday rate</em></small></span><span class="n">146<small>golfers</small></span><button>Send offer</button></div>
        <div class="seg-r"><span class="w">Guests of members · 3+ visits<small>not yet members · <em>membership invite at the member's course</em></small></span><span class="n">88<small>guests</small></span><button class="o">Review list</button></div>
        <div class="seg-r"><span class="w">Societies that play one course only<small>4 societies · 61 rounds here in 90 d · <em>second-course society day</em></small></span><span class="n">4<small>societies</small></span><button class="o">Review list</button></div></div></div>
      <div class="ins-c" style="grid-column:span 5"><h3>Caddies across the facility · 90 d<span class="r">loops by course · rating · requests</span></h3>
        <div class="cad-row hd"><span>#</span><span>Caddy</span><span>Loops</span><span>Rating</span><span style="text-align:right">Requested by</span></div>
        ${[[14,'Test Noi',[42,19,8],4.9,'31 golfers'],[28,'Test Nan',[23,27,11],4.8,'24 golfers'],[7,'Test Som',[30,12,14],4.8,'19 golfers'],[41,'Test May',[12,25,16],4.7,'15 golfers'],[3,'Test Fon',[28,6,2],4.6,'12 golfers'],[55,'Test Ploy',[4,9,31],4.6,'9 golfers']].map(r=>`<div class="cad-row"><b>#${r[0]}</b><span class="nm">${r[1]}</span><span class="sp">${r[2].map((v,i)=>`<i style="--cc:${COURSES[i].cc};width:${Math.round(v/69*100)}%" title="${COURSES[i].name} ${v}"></i>`).join('')}</span><span class="rt">${r[3]}</span><span class="mono">${r[4]}</span></div>`).join('')}
        <div class="lgd" style="margin-top:8px">${COURSES.map(c=>`<span style="--cc:${c.cc}"><i></i>${c.name}</span>`).join('')}</div></div>
    </div>`;
  }
} catch (e) { window.__err = e.message + ' @ ' + (e.stack||'').split('\n')[1]; document.title = 'ERR ' + e.message; } })();
</script>
</body>
</html>
