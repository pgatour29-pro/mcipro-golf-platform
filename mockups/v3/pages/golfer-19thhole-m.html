<!doctype html><html lang="en"><head><meta charset="utf-8"><title>3.0 · Golfer · 19th Hole (phone)</title>
<link rel="stylesheet" href="../kit/mcp3.css">
<style>
/* page-local layout glue only — every colour comes from mcp3.css tokens */
.grid-l{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lst{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.lst .hero-photo{height:66px;border-radius:0;flex:none}
.lst .hero-photo.wanted{background:linear-gradient(180deg,rgba(7,42,30,.1),rgba(7,42,30,.6)),linear-gradient(120deg,#2b5f7d,#5b8fa6 60%,#a9c8cf)}
.lst .hero-photo.svc{background:linear-gradient(180deg,rgba(7,42,30,.1),rgba(7,42,30,.6)),linear-gradient(120deg,#7a5d21,#c19a45 60%,#e3cf9a)}
.lst .cat{position:absolute;left:7px;top:7px;height:19px;font-size:10px;padding:0 7px;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;display:inline-flex;align-items:center;font-weight:700}
.lst .b{padding:8px 9px 8px;display:flex;flex-direction:column;flex:1}
.lst .b .t{font-size:13px;font-weight:700;line-height:1.2;height:31px;overflow:hidden}
.lst .b .pr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px}
.lst .b .pr .p{font-family:var(--f-mono);font-size:14.5px;font-weight:700;color:var(--turf-ink)}
.lst .b .pr .pill{height:19px;font-size:10px;padding:0 6px}
.lst .b .sl{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:10.5px;color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:hidden}
.lst .b .sl .avatar{width:19px;height:19px;font-size:9px}
.finep{display:flex;gap:6px;align-items:center;padding:6px 14px 7px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-3);font-weight:600}
.chips .chip{height:34px;padding:0 11px;font-size:13px}
.chips .chip .n{background:var(--signal);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:0 5px;height:17px;display:inline-flex;align-items:center}
</style></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="sb-r"><span class="ms" style="font-size:15px">signal_cellular_alt</span><span class="ms" style="font-size:15px">wifi</span><span class="sb-batt"></span></span></div>

  <div class="topbar">
    <button class="ib back"><span class="ms s26">arrow_back</span></button>
    <div class="title">19th Hole</div>
    <button class="ib"><span class="ms s20">search</span></button>
    <button class="btn p sm"><span class="ms s20">add</span>Sell</button>
  </div>

  <div class="content pad">
    <div class="chips">
      <button class="chip on">All</button>
      <button class="chip">Gear</button>
      <button class="chip">Services</button>
      <button class="chip">Wanted</button>
      <button class="chip">Mine<span class="n">2</span></button>
    </div>

    <div class="card" style="margin-top:10px">
      <div class="row compact">
        <div class="ic brass"><span class="ms">local_offer</span></div>
        <div class="tx"><div class="t">3 offers waiting</div><div class="s">Vokey 56° ×2 · Paradym ×1 · oldest 2 days</div></div>
        <button class="btn p sm">Review</button>
      </div>
      <div class="finep"><span class="ms s18">verified_user</span>Member board — no commission, deals are between members</div>
    </div>

    <div class="grid-l">
      <button class="lst">
        <span class="badge">1</span>
        <div class="hero-photo"><span class="cat">Gear</span></div>
        <div class="b">
          <div class="t">Callaway Paradym 10.5° driver</div>
          <div class="pr"><span class="p">฿9,500</span><span class="pill brass">1 offer</span></div>
          <div class="sl"><span class="avatar ini">PP</span>You · Jomtien</div>
        </div>
      </button>

      <button class="lst">
        <span class="badge">2</span>
        <div class="hero-photo"><span class="cat">Gear</span></div>
        <div class="b">
          <div class="t">Vokey SM9 56° wedge</div>
          <div class="pr"><span class="p">฿2,800</span><span class="pill brass">2 offers</span></div>
          <div class="sl"><span class="avatar ini">PP</span>You · Jomtien</div>
        </div>
      </button>

      <button class="lst">
        <div class="hero-photo svc"><span class="cat">Services</span></div>
        <div class="b">
          <div class="t">Golf lessons · Thai PGA pro</div>
          <div class="pr"><span class="p">฿1,500<span class="t-12">/hr</span></span><span class="pill turf">Verified</span></div>
          <div class="sl"><span class="avatar ini">PL</span>Ploy · Khao Kheow</div>
        </div>
      </button>

      <button class="lst">
        <div class="hero-photo svc"><span class="cat">Services</span></div>
        <div class="b">
          <div class="t">Cart share to Burapha, Sat</div>
          <div class="pr"><span class="p">฿300</span><span class="pill sky">2 seats</span></div>
          <div class="sl"><span class="avatar ini">TB</span>Tom Britt · TRGG</div>
        </div>
      </button>

      <button class="lst">
        <div class="hero-photo wanted"><span class="cat">Wanted</span></div>
        <div class="b">
          <div class="t">Wanted: Scotty Newport putter</div>
          <div class="pr"><span class="p">฿12,000</span><span class="pill">Paying</span></div>
          <div class="sl"><span class="avatar ini">CA</span>Calin · TRGG</div>
        </div>
      </button>

      <button class="lst">
        <div class="hero-photo"><span class="cat">Gear</span></div>
        <div class="b">
          <div class="t">Titleist Pro V1 · 3 dozen</div>
          <div class="pr"><span class="p">฿3,600</span><span class="pill">New</span></div>
          <div class="sl"><span class="avatar ini">EL</span>Erik Lundman · JGTS</div>
        </div>
      </button>
    </div>
  </div>

  <nav class="bottomnav">
    <button class="tab"><span class="ms">home</span>Today</button>
    <button class="tab"><span class="ms">flag</span>Events<span class="n">3</span></button>
    <button class="tab play"><span class="tri"><svg viewBox="0 0 96 96"><path d="M24.7 12.9 L79.3 43.2 Q88 48 79.3 52.9 L24.7 83.2 Q16 88 16 78 L16 18 Q16 8 24.7 12.9 Z" fill="#22c55e"/></svg></span>Play</button>
    <button class="tab"><span class="ms">sensors</span>Live</button>
    <button class="tab"><span class="ms">person</span>Me</button>
  </nav>
</div>
<script src="../kit/kit.js"></script>
</body></html>
