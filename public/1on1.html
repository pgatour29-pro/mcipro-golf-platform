<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#052e16">
    <title>1on1</title>
    <!-- 1on1 (v1103): the SPECIAL partner entry — Pete 2026-09-04: "a new special QR code or link for the female golfers so
         they don't go to the main system". Admin → Invites gives a partner invite as mycaddipro.com/1on1/CODE (+ QR). This
         page never shows the MyCaddiPro login: it stashes the invite, then hands the chosen provider straight to the app
         (/?oo=CODE&oo_login=<provider>), which starts that provider at once and lands her on the 1on1 partner screen. -->
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: #f1f5f9; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", "Noto Sans KR", "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; }
        .bar { background: #052e16; color: #fff; padding: 14px 16px calc(14px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 12px; }
        .bar .logo { width: 40px; height: 40px; border-radius: 12px; background: #0b4a2a; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.15); }
        .bar .logo svg { width: 24px; height: 24px; fill: #4ade80; }
        .bar .t { font-size: 18px; font-weight: 900; letter-spacing: .01em; }
        .bar .s { font-size: 12px; color: #a7f3d0; margin-top: 1px; }
        .lang { margin-left: auto; display: flex; gap: 4px; }
        .lang button { border: 1px solid rgba(255,255,255,.25); background: transparent; color: #d1fae5; font-size: 11px; font-weight: 800; padding: 4px 7px; border-radius: 999px; }
        .lang button.on { background: #22c55e; border-color: #22c55e; color: #052e16; }
        main { padding: 16px; max-width: 480px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
        h1 { font-size: 20px; font-weight: 900; margin: 0 0 8px; line-height: 1.25; }
        p { font-size: 14px; line-height: 1.5; color: #334155; margin: 0 0 16px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border-radius: 12px; padding: 13px 14px; font-size: 15px; font-weight: 800; border: 1px solid transparent; cursor: pointer; margin-top: 10px; }
        .btn svg { width: 22px; height: 22px; flex: 0 0 22px; }
        .line { background: #06c755; color: #fff; }
        .kakao { background: #fee500; color: #191919; }
        .google { background: #fff; color: #0f172a; border-color: #cbd5e1; }
        .muted { font-size: 12px; color: #64748b; margin-top: 14px; text-align: center; }
        .state { text-align: center; padding: 18px 6px; font-size: 14px; color: #334155; }
        .state.bad { color: #b91c1c; background: #fef2f2; border: 1px solid #fca5a5; border-radius: 12px; }
        .code { font-family: ui-monospace, Menlo, monospace; font-weight: 800; letter-spacing: .08em; color: #15803d; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <header class="bar">
        <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 2 7v10l10 5 10-5V7L12 2zm0 2.2 7.5 3.8L12 11.8 4.5 8 12 4.2zM4 9.6l7 3.5v7.1l-7-3.5V9.6zm9 10.6v-7.1l7-3.5v7.1l-7 3.5z"/></svg></div>
        <div><div class="t">1on1</div><div class="s" id="sub">JOA · Private playing partners</div></div>
        <div class="lang" id="lang"></div>
    </header>
    <main>
        <div class="card">
            <div id="checking" class="state">Checking your invite…</div>
            <div id="bad" class="state bad" hidden></div>
            <div id="ok" hidden>
                <h1 id="h"></h1>
                <p id="p"></p>
                <button type="button" class="btn line" onclick="go('line')"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.2 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.6 1.1-.5 5.9-3.5 8-6C21.3 14.4 22 12.8 22 11c0-4.4-4.5-8-10-8z"/></svg><span id="bLine">Continue with LINE</span></button>
                <button type="button" class="btn kakao" onclick="go('kakao')"><svg viewBox="0 0 24 24" fill="#191919"><path d="M12 3C6.5 3 2 6.4 2 10.6c0 2.7 1.8 5 4.5 6.4l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.5.1 1 .1 1.5.1 5.5 0 10-3.4 10-7.7S17.5 3 12 3z"/></svg><span id="bKakao">Continue with KakaoTalk</span></button>
                <button type="button" class="btn google" onclick="go('google')"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4c-.2 1.2-.9 2.3-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6C4.8 19.8 8.1 22 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1C2.4 8.8 2 10.4 2 12s.4 3.2 1.1 4.6L6.4 14z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8C17 3 14.7 2 12 2 8.1 2 4.8 4.2 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z"/></svg><span id="bGoogle">Continue with Google</span></button>
                <div class="muted" id="m"></div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.min.js" integrity="sha384-0UK+HVlz5Y7F//atDpPysyocv/PjGXQoBX+XSaL/eEotARW8rPFh+lL5sO0Ljzfi" crossorigin="anonymous"></script>
    <script src="supabase-config.js"></script>
    <script>
        var DICT = {
            en: { sub: 'JOA · Private playing partners', partner: 'You’re invited as a playing partner', member: 'You’re invited as a 1on1 member', p: 'Sign in to set up your 1on1 profile. You’ll come straight back here — this is separate from the main MyCaddiPro app.', line: 'Continue with LINE', kakao: 'Continue with KakaoTalk', google: 'Continue with Google', checking: 'Checking your invite…', invalid: 'This invite link has expired or was already used. Please ask your admin for a new one.', missing: 'This link is missing its invite code. Please ask your admin for a new link.', m: 'Invite code', login: 'Welcome back — sign in to 1on1', plogin: 'Use the same LINE, KakaoTalk or Google account you signed up with. You’ll go straight to your 1on1 screen.' },
            th: { sub: 'JOA · คู่เล่นส่วนตัว', partner: 'คุณได้รับเชิญเป็นคู่เล่น', member: 'คุณได้รับเชิญเป็นสมาชิก 1on1', p: 'เข้าสู่ระบบเพื่อตั้งค่าโปรไฟล์ 1on1 ของคุณ คุณจะกลับมาที่นี่โดยตรง — แยกจากแอป MyCaddiPro หลัก', line: 'ดำเนินการต่อด้วย LINE', kakao: 'ดำเนินการต่อด้วย KakaoTalk', google: 'ดำเนินการต่อด้วย Google', checking: 'กำลังตรวจสอบคำเชิญ…', invalid: 'ลิงก์คำเชิญนี้หมดอายุหรือถูกใช้แล้ว กรุณาขอลิงก์ใหม่จากผู้ดูแล', missing: 'ลิงก์นี้ไม่มีรหัสคำเชิญ กรุณาขอลิงก์ใหม่จากผู้ดูแล', m: 'รหัสคำเชิญ', login: 'ยินดีต้อนรับกลับ — เข้าสู่ระบบ 1on1', plogin: 'ใช้บัญชี LINE, KakaoTalk หรือ Google เดิมที่คุณสมัครไว้ คุณจะไปยังหน้า 1on1 ของคุณโดยตรง' },
            ko: { sub: 'JOA · 프라이빗 라운딩 파트너', partner: '플레잉 파트너로 초대되었습니다', member: '1on1 회원으로 초대되었습니다', p: '로그인하여 1on1 프로필을 설정하세요. 바로 이곳으로 돌아옵니다 — MyCaddiPro 메인 앱과는 별개입니다.', line: 'LINE으로 계속', kakao: '카카오톡으로 계속', google: 'Google로 계속', checking: '초대를 확인하는 중…', invalid: '이 초대 링크는 만료되었거나 이미 사용되었습니다. 관리자에게 새 링크를 요청해 주세요.', missing: '이 링크에 초대 코드가 없습니다. 관리자에게 새 링크를 요청해 주세요.', m: '초대 코드', login: '다시 오신 것을 환영합니다 — 1on1 로그인', plogin: '가입할 때 사용한 LINE, 카카오톡 또는 Google 계정으로 로그인하세요. 바로 1on1 화면으로 이동합니다.' },
            ja: { sub: 'JOA · プライベートな同伴者', partner: '同伴者として招待されています', member: '1on1会員として招待されています', p: 'サインインして1on1プロフィールを設定してください。そのままここに戻ります — MyCaddiPro本体とは別です。', line: 'LINEで続ける', kakao: 'カカオトークで続ける', google: 'Googleで続ける', checking: '招待を確認中…', invalid: 'この招待リンクは期限切れか使用済みです。管理者に新しいリンクを依頼してください。', missing: 'このリンクには招待コードがありません。管理者に新しいリンクを依頼してください。', m: '招待コード', login: 'おかえりなさい — 1on1にサインイン', plogin: '登録時に使ったLINE・カカオトーク・Googleのアカウントでサインインしてください。そのまま1on1画面に移動します。' }
        };
        var LANGS = ['en', 'th', 'ko', 'ja'];
        var lang = (function () { try { var s = localStorage.getItem('oo_lang'); if (s && DICT[s]) return s; } catch (e) {} var n = String(navigator.language || 'en').slice(0, 2).toLowerCase(); return DICT[n] ? n : 'en'; })();
        var code = (function () { var m = location.search.match(/[?&](?:c|oo|code)=([A-Za-z0-9]{4,16})/); return m ? m[1].toUpperCase() : ''; })();
        var kind = 'partner';
        function t(k) { return (DICT[lang] && DICT[lang][k]) || DICT.en[k] || k; }
        function paint() {
            document.documentElement.lang = lang;
            document.getElementById('sub').textContent = t('sub');
            document.getElementById('lang').innerHTML = LANGS.map(function (l) { return '<button type="button" class="' + (l === lang ? 'on' : '') + '" onclick="setLang(\'' + l + '\')">' + l.toUpperCase() + '</button>'; }).join('');
            document.getElementById('checking').textContent = t('checking');
            document.getElementById('h').textContent = t(kind === 'login' ? 'login' : (kind === 'member' ? 'member' : 'partner'));
            document.getElementById('p').textContent = t(kind === 'login' ? 'plogin' : 'p');
            document.getElementById('bLine').textContent = t('line'); document.getElementById('bKakao').textContent = t('kakao'); document.getElementById('bGoogle').textContent = t('google');
            document.getElementById('m').innerHTML = code ? t('m') + ': <span class="code">' + code + '</span>' : '';
            var bad = document.getElementById('bad'); if (!bad.hidden) bad.textContent = t(bad.getAttribute('data-k') || 'invalid');
        }
        function setLang(l) { if (!DICT[l]) return; lang = l; try { localStorage.setItem('oo_lang', l); } catch (e) {} paint(); }
        function show(id) { ['checking', 'bad', 'ok'].forEach(function (x) { document.getElementById(x).hidden = x !== id; }); }
        function fail(k) { var bad = document.getElementById('bad'); bad.setAttribute('data-k', k); bad.textContent = t(k); show('bad'); }
        function go(provider) {
            /* a partner device: the app's login screen bounces back here from now on (cleared when a non-partner logs in) */
            try { if (kind !== 'member') localStorage.setItem('oo_partner_home', '1'); } catch (e) {}
            if (code) { try { localStorage.setItem('oo_invite', code); } catch (e) {} location.href = '/?oo=' + encodeURIComponent(code) + '&oo_login=' + provider; }
            else location.href = '/?oo_login=' + provider;
        }
        paint();
        if (!code) { kind = 'login'; paint(); show('ok'); }   /* no code = the partner LOGIN page (Pete: "a login page just for the female golfers") */
        else {
            /* validate through the anon RPC when the client loads; if the client is unavailable, still let her continue —
               the app re-validates the code at redemption */
            var done = false;
            var finish = function (ok, k) { if (done) return; done = true; if (ok === false) { fail('invalid'); return; } if (k) kind = k; paint(); show('ok'); };
            setTimeout(function () { finish(null); }, 4000);
            (async function () {
                try {
                    var sb = window.SupabaseDB && window.SupabaseDB.client;
                    if (!sb) { finish(null); return; }
                    var r = await sb.rpc('oo_invite_kind', { p_code: code });
                    if (r.error) { finish(null); return; }
                    finish(!!(r.data && r.data.valid), r.data && r.data.kind);
                } catch (e) { finish(null); }
            })();
        }
    </script>
</body>
</html>
