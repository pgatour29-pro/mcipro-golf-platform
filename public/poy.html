<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRGG Player of the Year 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* Theme variables — dark values in :root, .theme-light overrides (same convention as
           results.html, shared localStorage key mcipro_colorTheme). LIGHT is the default:
           body ships with class="theme-light" so first paint is light, applyTheme() only
           switches to dark when the user chose it. Embed mode is always light (app canvas). */
        :root {
            --bg: linear-gradient(135deg, #0a0f1a, #1a1a2e);
            --ink:#f1f5f9; --sub:#94a3b8; --faint:#64748b;
            --card:rgba(255,255,255,0.04); --card2:rgba(255,255,255,0.05);
            --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.1);
            --hover:rgba(255,255,255,0.05);
            --green:#22c55e; --good:#22c55e; --bad:#ef4444; --info:#3b82f6;
            --gold-ink:#fbbf24; --silver-ink:#94a3b8; --bronze-ink:#d97706;
            --pod1-bg:linear-gradient(135deg, rgba(251,191,36,0.2), rgba(245,158,11,0.1)); --pod1-bd:rgba(251,191,36,0.4);
            --pod2-bg:linear-gradient(135deg, rgba(148,163,184,0.2), rgba(100,116,139,0.1)); --pod2-bd:rgba(148,163,184,0.3);
            --pod3-bg:linear-gradient(135deg, rgba(217,119,6,0.2), rgba(180,83,9,0.1));      --pod3-bd:rgba(217,119,6,0.3);
            --badge-bg:rgba(255,255,255,0.1); --badge-ink:#94a3b8;
            --pill-high-bg:rgba(34,197,94,0.2);  --pill-high-ink:#86efac;
            --pill-mid-bg:rgba(59,130,246,0.15); --pill-mid-ink:#93c5fd;
            --pill-low-bg:rgba(239,68,68,0.15);  --pill-low-ink:#fca5a5;
            --input-bg:rgba(255,255,255,0.08); --input-bd:rgba(255,255,255,0.15);
        }
        body.theme-light {
            --bg:#f1f5f9;
            --ink:#0f172a; --sub:#475569; --faint:#64748b;
            --card:#ffffff; --card2:#f8fafc;
            --line:#e2e8f0; --line2:#e2e8f0;
            --hover:#f1f5f9;
            --green:#16a34a; --good:#16a34a; --bad:#dc2626; --info:#2563eb;
            --gold-ink:#d97706; --silver-ink:#64748b; --bronze-ink:#b45309;
            --pod1-bg:linear-gradient(135deg, rgba(251,191,36,0.22), rgba(245,158,11,0.08)); --pod1-bd:rgba(245,158,11,0.45);
            --pod2-bg:linear-gradient(135deg, rgba(100,116,139,0.14), rgba(100,116,139,0.05)); --pod2-bd:rgba(100,116,139,0.35);
            --pod3-bg:linear-gradient(135deg, rgba(217,119,6,0.16), rgba(180,83,9,0.06));     --pod3-bd:rgba(217,119,6,0.4);
            --badge-bg:#e2e8f0; --badge-ink:#475569;
            --pill-high-bg:#dcfce7; --pill-high-ink:#15803d;
            --pill-mid-bg:#dbeafe; --pill-mid-ink:#1d4ed8;
            --pill-low-bg:#fee2e2; --pill-low-ink:#b91c1c;
            --input-bg:#ffffff; --input-bd:#cbd5e1;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
        .msym { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; display:inline-block; line-height:1; vertical-align:middle; }
        .icon-btn { width:36px; height:36px; border:1px solid var(--line2); background:var(--card); color:var(--sub); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .gold { color: var(--gold-ink); }
        .silver { color: var(--silver-ink); }
        .bronze { color: var(--bronze-ink); }
        .podium-card { border-radius: 16px; padding: 16px; text-align: center; position: relative; overflow: hidden; }
        .podium-1 { background: var(--pod1-bg); border: 2px solid var(--pod1-bd); }
        .podium-2 { background: var(--pod2-bg); border: 2px solid var(--pod2-bd); }
        .podium-3 { background: var(--pod3-bg); border: 2px solid var(--pod3-bd); }
        /* Standings table. Was a stack of flex divs; now a real <table> for 1.3.1 (row/column
           association). table-layout:fixed + the widths below reproduce the old flex tracks
           EXACTLY: 12px gutter + 28px badge | rest | 50 | 40 | 35 + 12px gutter. */
        .poy-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .poy-table th { font-size: 10px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
        .poy-table td { padding: 10px 0; vertical-align: middle; }
        .poy-table .c-pos { width: 40px; padding-left: 12px; text-align: center; }
        .poy-table td.c-pos { line-height: 0; }
        .poy-table .c-player { padding-left: 8px; text-align: left; }
        .poy-table .c-pts { width: 50px; text-align: center; font-size: 15px; font-weight: 700; color: var(--green); }
        .poy-table .c-rnds { width: 40px; text-align: center; font-size: 12px; color: var(--sub); }
        .poy-table .c-avg { width: 47px; padding-right: 12px; text-align: center; font-size: 12px; color: var(--sub); }
        .poy-table th.c-pts, .poy-table th.c-rnds, .poy-table th.c-avg { font-size: 10px; font-weight: 700; color: var(--faint); }
        .poy-table .c-detail { padding: 0; }
        .player-row { border-bottom: 1px solid var(--line); transition: background 0.2s; cursor: pointer; }
        .player-row:hover { background: var(--hover); }
        /* Real <button> so the expand is keyboard operable (2.1.1/4.1.2) without putting
           role="button" on the <tr> — that would strip the row/cell table semantics. Styled
           to be indistinguishable from the plain div it replaced. */
        .poy-name-btn { display: block; width: 100%; min-width: 0; background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
        .pos-badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-size: 12px; font-weight: 700; line-height: 1; flex-shrink: 0; background: var(--badge-bg); color: var(--badge-ink); }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .score-pill { display: inline-block; padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: 600; margin: 1px; }
        .score-pill.high { background: var(--pill-high-bg); color: var(--pill-high-ink); }
        .score-pill.mid { background: var(--pill-mid-bg); color: var(--pill-mid-ink); }
        .score-pill.low { background: var(--pill-low-bg); color: var(--pill-low-ink); }
        .detail-panel { display: none; padding: 8px 12px 12px 40px; background: var(--card2); }
        .detail-panel.open { display: block; }
        .search-input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--input-bd); background: var(--input-bg); color: var(--ink); font-size: 14px; outline: none; }
        .search-input:focus { border-color: var(--green); }
        .search-input::placeholder { color: var(--faint); }
        .stat-box { text-align: center; padding: 8px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); }
        .stat-val { font-size: 20px; font-weight: 700; color: var(--ink); }
        .stat-label { font-size: 10px; color: var(--faint); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        /* Embed mode (?embed=1): rendered inside the app's POY tab — height fits content
           (no forced viewport height) and the app page does the scrolling. */
        body.embed { min-height: 0; border-radius: 16px; }
        body.embed .icon-btn[data-theme-toggle] { display: none; }
    </style>
</head>
<body class="theme-light">
    <div style="max-width: 600px; margin: 0 auto; padding: 12px; position: relative;">
        <!-- Theme toggle (hidden in embed — the app canvas is always light) -->
        <button class="icon-btn" data-theme-toggle onclick="toggleTheme()" title="Theme" style="position:absolute; top:12px; right:12px;">
            <span class="msym theme-toggle-icon" style="font-size:20px;">dark_mode</span>
        </button>

        <!-- Header -->
        <div style="text-align:center; margin: 8px 0 16px;">
            <div style="font-size: 36px; margin-bottom: 4px;">🏆</div>
            <h1 style="font-size: 22px; font-weight: 800; color: var(--ink); margin-bottom: 2px;">Player of the Year</h1>
            <div style="font-size: 13px; color: var(--sub);">Travellers Rest Golf Group — 2026</div>
            <div style="font-size: 11px; color: var(--faint); margin-top: 4px;">Best 20 Stableford rounds · Updated live</div>
        </div>

        <!-- Top 3 Podium -->
        <div id="podium" style="margin-bottom: 16px;"></div>

        <!-- Stats Summary -->
        <div id="statsSummary" style="margin-bottom: 12px;"></div>

        <!-- Search -->
        <div style="margin-bottom: 12px;">
            <input type="text" id="searchInput" class="search-input" placeholder="Search player..." oninput="filterPlayers()">
        </div>

        <!-- Leaderboard Table -->
        <div id="leaderboard" style="background: var(--card); border-radius: 14px; border: 1px solid var(--line2); overflow: hidden;">
            <div style="padding: 12px; text-align: center; color: var(--faint);">Loading...</div>
        </div>

        <!-- Footer -->
        <div style="text-align: center; padding: 20px 0; color: var(--faint); font-size: 11px;">
            Data from masterscoreboard.co.uk · MyCaddiPro
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script>
    let allPlayers = [];

    // Embedded inside the app's POY tab? (see index.html golfer-poy pane) — report our height
    // so the parent frame grows to fit and the app page stays the single scroller.
    const EMBED = new URLSearchParams(location.search).get('embed') === '1';
    if (EMBED) {
        document.body.classList.add('embed');
        const _postH = function(){
            try { parent.postMessage({ type: 'mciproPoyHeight', h: document.documentElement.scrollHeight }, window.location.origin); } catch(e){}
        };
        try { new ResizeObserver(_postH).observe(document.body); } catch(e){}
        window.addEventListener('load', _postH);
        setInterval(_postH, 1200);
    }

    // ---------- Theme (session-only; EVERY load starts LIGHT — stored pref ignored, Pete 2026-08-16) ----------
    let _sessionTheme = 'light';
    function applyTheme() {
        const t = EMBED ? 'light' : _sessionTheme; // app tab canvas is always light — match it
        document.body.classList.toggle('theme-light', t === 'light');
        document.querySelectorAll('[data-theme-toggle] .theme-toggle-icon').forEach(ic => { ic.textContent = t === 'light' ? 'dark_mode' : 'light_mode'; });
    }
    function toggleTheme() {
        _sessionTheme = (_sessionTheme === 'light') ? 'dark' : 'light';
        applyTheme();
    }
    applyTheme();

    async function loadPOY() {
        const sb = window.SupabaseDB?.client;
        if (!sb) { setTimeout(loadPOY, 500); return; }

        const { data, error } = await sb
            .from('trgg_poy_cache')
            .select('*')
            .order('pos', { ascending: true });

        if (error) {
            document.getElementById('leaderboard').innerHTML = '<div style="padding:20px;text-align:center;color:var(--bad);">Error loading data</div>';
            console.error(error);
            return;
        }

        allPlayers = data || [];
        renderPodium();
        renderStats();
        renderLeaderboard(allPlayers);
    }

    function renderPodium() {
        const top3 = allPlayers.slice(0, 3);
        if (top3.length < 3) return;

        const medals = ['🥇', '🥈', '🥉'];
        const classes = ['podium-1', 'podium-2', 'podium-3'];
        const colors = ['gold', 'silver', 'bronze'];

        document.getElementById('podium').innerHTML = `
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
                ${top3.map((p, i) => `
                    <div class="podium-card ${classes[i]}">
                        <div style="font-size:28px;margin-bottom:4px;">${medals[i]}</div>
                        <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px;">${p.display_name.split(',')[0]}</div>
                        <div style="font-size:11px;color:var(--sub);margin-bottom:6px;">${p.display_name.split(',')[1]?.trim() || ''}</div>
                        <div class="${colors[i]}" style="font-size:28px;font-weight:800;">${p.pts}</div>
                        <div style="font-size:10px;color:var(--sub);">pts · ${p.total_rounds} rnds</div>
                        <div style="font-size:10px;color:var(--faint);margin-top:4px;">Best: ${p.best_score} · Avg: ${p.avg_score}</div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderStats() {
        const total = allPlayers.length;
        const totalRounds = allPlayers.reduce((s, p) => s + (p.total_rounds || 0), 0);
        const topAvg = allPlayers.slice(0, 20).reduce((s, p) => s + parseFloat(p.avg_score || 0), 0) / Math.min(20, allPlayers.length);

        document.getElementById('statsSummary').innerHTML = `
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
                <div class="stat-box">
                    <div class="stat-val">${total}</div>
                    <div class="stat-label">Players</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val">${totalRounds.toLocaleString()}</div>
                    <div class="stat-label">Total Rounds</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val">${topAvg.toFixed(1)}</div>
                    <div class="stat-label">Top 20 Avg</div>
                </div>
            </div>
        `;
    }

    function getScoreClass(score) {
        if (score >= 36) return 'high';
        if (score >= 30) return 'mid';
        return 'low';
    }

    let poyShowAll = false;
    function renderLeaderboard(players) {
        if (players.length === 0) {
            document.getElementById('leaderboard').innerHTML = '<div style="padding:20px;text-align:center;color:var(--faint);">No players found</div>';
            return;
        }

        // Embedded in the app: cap the initial list so the section stays a sane height —
        // the full cache is ~900 players (≈51,000px tall). Search always covers everyone.
        const CAP = 50;
        const searching = ((document.getElementById('searchInput') || {}).value || '').trim().length > 0;
        let list = players, capped = false;
        if (EMBED && !poyShowAll && !searching && players.length > CAP + 10) {
            list = players.slice(0, CAP);
            capped = true;
        }

        // Header
        let html = `
            <table class="poy-table">
                <caption class="sr-only">Player of the Year standings</caption>
                <thead>
                    <tr>
                        <th scope="col" class="c-pos">#</th>
                        <th scope="col" class="c-player">Player</th>
                        <th scope="col" class="c-pts">Pts</th>
                        <th scope="col" class="c-rnds">Rnds</th>
                        <th scope="col" class="c-avg">Avg</th>
                    </tr>
                </thead>
                <tbody>
        `;

        list.forEach((p, idx) => {
            const posStyle = p.pos <= 3
                ? `background:${p.pos === 1 ? 'linear-gradient(135deg,#fbbf24,#f59e0b)' : p.pos === 2 ? 'linear-gradient(135deg,#e2e8f0,#94a3b8)' : 'linear-gradient(135deg,#f59e0b,#d97706)'};color:${p.pos === 2 ? '#1e293b' : '#422006'};`
                : '';

            html += `
                <tr class="player-row" onclick="toggleDetail('detail-${idx}')">
                    <td class="c-pos"><span class="pos-badge" style="${posStyle}">${p.pos}</span></td>
                    <td class="c-player">
                        <button type="button" class="poy-name-btn" aria-expanded="false" aria-controls="detail-${idx}" onclick="event.stopPropagation();toggleDetail('detail-${idx}');">
                            <span style="display:block;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.display_name}</span>
                            <span style="display:block;font-size:10px;color:var(--faint);">Best: ${p.best_score}</span>
                        </button>
                    </td>
                    <td class="c-pts">${p.pts}</td>
                    <td class="c-rnds">${p.total_rounds}</td>
                    <td class="c-avg">${p.avg_score}</td>
                </tr>
                <tr>
                    <td class="c-detail" colspan="5">
                        <div id="detail-${idx}" class="detail-panel">
                            <div style="font-size:11px;color:var(--sub);margin-bottom:6px;">Top ${p.rounds} scores counted${p.total_rounds > p.rounds ? ` (of ${p.total_rounds} played)` : ''}</div>
                            <div style="display:flex;flex-wrap:wrap;gap:3px;">
                                ${(p.scores || []).map(s => `<span class="score-pill ${getScoreClass(s)}">${s}</span>`).join('')}
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;">
                                <div style="font-size:10px;color:var(--faint);">Best: <span style="color:var(--good);font-weight:600;">${p.best_score}</span></div>
                                <div style="font-size:10px;color:var(--faint);">Worst: <span style="color:var(--bad);font-weight:600;">${p.worst_score}</span></div>
                                <div style="font-size:10px;color:var(--faint);">Avg: <span style="color:var(--info);font-weight:600;">${p.avg_score}</span></div>
                            </div>
                        </div>
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table>`;

        if (capped) {
            html += `<button onclick="poyExpandAll()" style="display:block;width:100%;padding:13px;background:none;border:none;border-top:1px solid var(--line2);color:var(--green);font-size:13px;font-weight:700;cursor:pointer;">Show all ${players.length} players</button>`;
        }

        document.getElementById('leaderboard').innerHTML = html;
    }

    function poyExpandAll() {
        poyShowAll = true;
        renderLeaderboard(allPlayers);
    }

    function toggleDetail(id) {
        const el = document.getElementById(id);
        if (!el) return;
        const open = el.classList.toggle('open');
        // Keep the row's expand button in sync (4.1.2)
        const btn = document.querySelector('.poy-name-btn[aria-controls="' + id + '"]');
        if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function filterPlayers() {
        const search = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!search) {
            renderLeaderboard(allPlayers);
            return;
        }
        const filtered = allPlayers.filter(p => p.display_name.toLowerCase().includes(search));
        renderLeaderboard(filtered);
    }

    // Load on ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadPOY);
    } else {
        loadPOY();
    }
    </script>
</body>
</html>
