<!--
  QR GUEST VENUE PAGE (2026-09-27). mycaddipro.com/q/<venue> — one permanent QR per venue.
  No app, no login: name + handicap + phone once, then register for society events at this venue and
  request caddies here. Every read/write is a SECURITY DEFINER RPC in sql/qr_guest_venue_20260927.sql;
  the phone keeps a random secret (localStorage qrg_token) that the DB checks on every write.
  Venue matching = CourseLink token table (course-society-link.js), the same one the pro shop tee sheet
  uses to find society events at its course. Event cards copy the golfer app's .scv3g-ec CSS.
-->
<style>
:root{--g-bg:#F2F4F6;--g-card:#FFFFFF;--g-hair:rgba(15,23,42,.17);--g-ink:#10151B;--g-mut:#3E4956;--g-dim:#5C6875;--g-grnD:#16a34a;--g-blu:#2563eb;--g-amb:#b45309;--g-red:#e11d48;--g-box:#EDF0F3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--g-bg);color:var(--g-ink);font-family:Inter,system-ui,sans-serif}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.msi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;display:inline-block;vertical-align:middle;font-size:20px;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
.hd{position:sticky;top:0;z-index:5;height:56px;background:#fff;border-bottom:1px solid var(--g-hair);display:flex;align-items:center;gap:10px;padding:0 14px}
.hd .ic{font-size:26px;color:var(--g-grnD)}
.hd .t{font:700 15px/1.1 'Instrument Sans',sans-serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .t small{display:block;font:500 9.5px/1.3 'JetBrains Mono',monospace;color:var(--g-mut);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.qrpill{font:700 9px/1 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--g-grnD);border:1px solid var(--g-grnD);border-radius:999px;padding:5px 8px;display:inline-flex;gap:3px;align-items:center;background:#fff}
.qrpill .msi{font-size:12px}
.pad{padding:12px}
.lbl{font:600 9px/1 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--g-mut);text-transform:uppercase;margin:14px 2px 7px}
.card{background:#fff;border:1px solid var(--g-hair);border-radius:16px;padding:14px}
.inp{width:100%;height:46px;border:1px solid var(--g-hair);border-radius:12px;background:#fff;padding:0 12px;font:500 16px Inter,sans-serif;color:var(--g-ink);outline:none}
.inp:focus{border-color:var(--g-grnD);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.phrow{display:flex;gap:6px}.phrow .cc{flex:0 0 84px}
.big{width:100%;height:50px;border:none;border-radius:14px;background:var(--g-grnD);color:#fff;font:700 15px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px}
.big:disabled{opacity:.55}
.big.ghost{background:#fff;color:var(--g-ink);border:1px solid var(--g-hair)}
.note{font:500 12px/1.45 Inter,sans-serif;color:var(--g-mut);margin-top:10px}
.err{font:600 13px/1.4 Inter,sans-serif;color:#b91c1c;margin-top:10px}
.hero{padding:26px 16px 6px;text-align:center}
.hero .logo{width:64px;height:64px;border-radius:999px;background:var(--g-grnD);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hero .logo .msi{font-size:36px;color:#fff}
.hero h1{font:700 21px/1.2 'Instrument Sans',sans-serif;margin:10px 0 4px}
.hero p{font:500 13px/1.4 Inter,sans-serif;color:var(--g-mut);margin:0}
/* golfer app event card (.scv3g-ec, index.html ~9802) */
.ec{background:var(--g-card);border:1px solid var(--g-hair);border-radius:16px;padding:11px 12px;display:flex;gap:11px;align-items:center;margin-bottom:8px}
.ec.reg{border:2px solid #3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.28);padding:10px 11px}
.ec .d{flex:0 0 44px;text-align:center;background:var(--g-box);border:1px solid var(--g-hair);border-radius:11px;padding:7px 0;align-self:flex-start}
.ec .d .w{font:600 8px/1 'JetBrains Mono',monospace;color:var(--g-dim)}
.ec .d .n{font:300 20px/1.1 Outfit,sans-serif}
.ec .d.wknd{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:rgba(220,38,38,.15)}.ec .d.wknd .w,.ec .d.wknd .n{color:#dc2626}
.ec .m{flex:1;min-width:0}
.ec .nm{font:700 15px/1.15 'Instrument Sans',sans-serif;display:flex;align-items:center;gap:6px;min-width:0}
.ec .nm>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec .nm img,.ec .nm .sl{width:18px;height:18px;border-radius:999px;flex:0 0 auto;object-fit:cover}
.ec .nm .sl{background:var(--g-box);display:inline-flex;align-items:center;justify-content:center;font:700 8px Inter;color:var(--g-mut)}
.ec .s{font:500 9.5px/1.4 'JetBrains Mono',monospace;color:var(--g-mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tag{font:600 8px/1 'JetBrains Mono',monospace;border:1px solid var(--g-hair);border-radius:6px;padding:4px 6px;color:var(--g-mut);text-transform:uppercase}
.tag.g{color:#fff;background:var(--g-grnD);border-color:var(--g-grnD)}
.tag.b{color:var(--g-blu);border-color:rgba(96,165,250,.4)}
.tag.r{color:var(--g-red);border-color:rgba(225,29,72,.4)}
.ec .bar{height:5px;border-radius:999px;background:var(--g-box);overflow:hidden;margin-top:6px}
.ec .bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#4ade80)}
.ec .r{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end}
.ec .fee{font:600 14px/1 'JetBrains Mono',monospace}
.btn{margin-top:6px;border:none;border-radius:9px;padding:8px 12px;background:var(--g-grnD);color:#fff;font:700 9px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.btn.danger{background:transparent;border:1px solid rgba(225,29,72,.5);color:var(--g-red)}
.btn.ghost{background:transparent;border:1px solid var(--g-hair);color:var(--g-mut)}
.btn:disabled{opacity:.5}
.tile{display:flex;align-items:center;gap:10px;padding:12px;border-color:var(--g-grnD);width:100%;text-align:left}
.tile .msi{font-size:26px;color:var(--g-grnD)}
.tile b{font:700 14px Inter;display:block}.tile span.sub{font:500 11px Inter;color:var(--g-mut)}
.empty{text-align:center;font:500 13px/1.45 Inter;color:var(--g-mut);padding:14px 6px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,13,16,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:20px 20px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;max-height:92vh;overflow:auto}
.grab{width:40px;height:4px;border-radius:9px;background:#cbd5e1;margin:0 auto 10px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--g-hair);border-radius:12px;padding:11px 12px;margin-top:8px;width:100%;background:#fff;text-align:left}
.opt .msi{font-size:22px;color:var(--g-mut)}
.opt .tx{flex:1;font:600 14px Inter}
.opt .tx small{display:block;font:500 11px Inter;color:var(--g-mut);margin-top:2px}
.opt.on{border-color:var(--g-grnD);background:#f0fdf4}.opt.on .msi{color:var(--g-grnD)}
.opt.lock{opacity:.85}
.sw{width:38px;height:22px;border-radius:99px;background:#cbd5e1;position:relative;flex:0 0 auto}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:#fff;transition:left .15s}
.opt.on .sw{background:#16a34a}.opt.on .sw:after{left:19px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px dashed var(--g-hair)}
.tot b{font:700 20px 'JetBrains Mono',monospace}.tot span{font:600 12px Inter;color:var(--g-mut)}
.ok{background:#f0fdf4;border:1px solid #86efac;border-radius:16px;padding:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.ok>.msi{color:#16a34a;font-size:26px}
.ok b{font:700 15px Inter;display:block}.ok .okt{font:500 12px/1.45 Inter;color:#14532d}
/* caddies */
.dstrip{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;scrollbar-width:none}
.dc{flex:0 0 46px;text-align:center;background:#fff;border:1px solid var(--g-hair);border-radius:11px;padding:6px 0}
.dc .w{font:600 8px/1 'JetBrains Mono',monospace;color:var(--g-dim)}.dc .n{font:300 19px/1.15 Outfit,sans-serif}
.dc.we{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:rgba(220,38,38,.15)}.dc.we .w,.dc.we .n{color:#dc2626}
.dc.on{background:#16a34a;border-color:#16a34a;color:#fff}.dc.on .w,.dc.on .n{color:#fff}
.tt{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;scrollbar-width:none}
.tt button{flex:0 0 auto;font:600 12px 'JetBrains Mono',monospace;border:1px solid var(--g-hair);background:#fff;border-radius:9px;padding:8px 9px}
.tt button.on{background:#10151B;color:#fff;border-color:#10151B}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:480px){.cg{grid-template-columns:repeat(4,1fr)}}
.cd{background:#fff;border:1px solid var(--g-hair);border-radius:14px;overflow:hidden;text-align:center;position:relative;padding:0}
.cd .ph{width:100%;height:92px;object-fit:cover;display:block;background:#e2e8f0}
.cd .ph.none{display:flex;align-items:center;justify-content:center}.cd .ph.none .msi{font-size:36px;color:#94a3b8}
.cd .no{position:absolute;top:6px;left:6px;font:700 10px 'JetBrains Mono',monospace;background:#10151B;color:#fff;border-radius:7px;padding:3px 6px}
.cd .cn{font:700 12.5px 'Instrument Sans',sans-serif;margin-top:6px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .cr{font:500 8.5px 'JetBrains Mono',monospace;color:var(--g-mut);margin:2px 4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd.pick{border:2px solid #16a34a;box-shadow:0 0 0 2px rgba(34,197,94,.28)}
.cd.pick:after{content:'check_circle';font-family:'Material Symbols Outlined';position:absolute;top:5px;right:6px;color:#16a34a;background:#fff;border-radius:99px;font-size:20px;line-height:1}
.cd.busy{opacity:.45}.cd.busy .cr{color:#b91c1c;font-weight:700}
.stick{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:560px;margin:0 auto;background:#fff;border-top:1px solid var(--g-hair);padding:10px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(15,23,42,.06)}
.cadpage{padding-bottom:170px}
.stick .sum{font:600 12px Inter;color:var(--g-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stick .sum b{color:var(--g-ink)}
.mycad{display:flex;gap:10px;align-items:center;padding:10px;margin-bottom:8px}
.mycad img,.mycad .ph0{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#e2e8f0;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.mycad .tx{flex:1;min-width:0}.mycad .tx b{font:700 14px 'Instrument Sans',sans-serif;display:block}
.mycad .tx span{font:500 10px/1.4 'JetBrains Mono',monospace;color:var(--g-mut);display:block}
.foot{text-align:center;font:500 12px/1.5 Inter;color:var(--g-mut);margin-top:18px}
.foot a{color:var(--g-grnD);font-weight:700;text-decoration:none}
.foot button{background:none;border:none;color:var(--g-mut);text-decoration:underline;font:500 12px Inter;margin-top:6px}
.busyveil{position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
.spin{width:34px;height:34px;border-radius:99px;border:3px solid #bbf7d0;border-top-color:#16a34a;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:16px;right:16px;bottom:24px;z-index:50;max-width:520px;margin:0 auto;background:#10151B;color:#fff;border-radius:12px;padding:12px 14px;font:600 14px/1.35 Inter}
</style>
</head>

      opt('comp', 'emoji_events', t('comp'), e.is_trgg ? t('compTrgg') : t('compSub'), e.is_trgg || o.comp, e.is_trgg) +
      '<div class="tot"><span>' + esc(t('youPay')) + '</span><b>' + baht(total) + '</b></div>' +
      '<button class="big" data-act="confirm"><span class="msi">how_to_reg</span>' + esc(t('confirm')) + '</button></div>';
    document.body.appendChild(d);
  }

  // caddy picker: S.cad = { date, time, eventId, pick, list, loading }
  var TIMES = []; for (var m = 6 * 60; m <= 13 * 60 + 30; m += 30) TIMES.push(hhmm(m));
  async function loadCaddies() {
    var c = S.cad; c.loading = true; render();
    try {
      var rows = await rpc('qr_venue_caddies', { p_course_ids: V.slugs.concat([V.venue.replace(/ /g, '-'), V.venue.replace(/ /g, '_'), V.venue.replace(/ /g, '')]), p_name_prefix: V.venue.split(' ')[0], p_date: c.date });
      if (S.cad !== c) return;
      c.list = (rows || []).filter(function (r) { return atVenue(r.course_name) || V.slugs.indexOf(r.course_id) >= 0 || (r.course_id || '').replace(/[_-]/g, ' ') === V.venue; });
    } catch (e) { c.list = []; console.warn('[QR] caddies', e); }
    c.loading = false; render();
  }
  function nowBkkMins() { return mins(new Date(Date.now() + 7 * 3600e3).toISOString().slice(11, 16)); }
  function timesFor(iso) { var today = bkkToday(), nm = nowBkkMins(); return TIMES.filter(function (x) { return iso !== today || mins(x) > nm + 30; }); }
  function firstDay() { var d = bkkToday(); return timesFor(d).length ? d : addDays(d, 1); }
  function busyAt(r, time) {
    if (r.day_off) return t('dayOff');
    var tm = mins(time); if (tm == null) return null;
    for (var i = 0; i < (r.busy || []).length; i++) { var b = mins(r.busy[i]); if (b != null && Math.abs(b - tm) < (r.block || 255)) return t('booked') + ' ' + r.busy[i]; }
    return null;
  }
  function renderCaddy() {
    var c = S.cad, ev = c.eventId ? S.events.find(function (x) { return x.id === c.eventId; }) : null;
    var h = header(meLine()) + '<div class="pad cadpage">';
    h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="btn ghost" data-act="home" style="margin:0"><span class="msi" style="font-size:14px">arrow_back</span> ' + esc(t('back')) + '</button><b style="font:700 16px \'Instrument Sans\',sans-serif">' + esc(t('pickCaddy')) + '</b></div>';
    if (ev) {
      h += '<div class="note" style="margin:0 0 10px">' + esc(t('forGame', { e: socAbbr(ev) + ' · ' + shortTitle(ev), d: longDate(ev.event_date), t: hm(ev.start_time) })) + '</div>';
    } else {
      var first = firstDay(), days = ''; for (var i = 0; i < 14; i++) { var iso = addDays(first, i); days += '<button class="dc' + (iso === c.date ? ' on' : isWe(iso) ? ' we' : '') + '" data-act="day" data-d="' + iso + '"><div class="w">' + esc(wd(iso)) + '</div><div class="n">' + dn(iso) + '</div></button>'; }
      var times = timesFor(c.date);
      h += '<div class="dstrip">' + days + '</div><div class="lbl" style="margin-top:0">' + esc(t('pickTime')) + '</div><div class="tt">' + times.map(function (x) { return '<button class="' + (x === c.time ? 'on' : '') + '" data-act="time" data-t="' + x + '">' + x + '</button>'; }).join('') + '</div>';
    }
    if (c.loading) h += '<div class="spin" style="margin:30px auto"></div>';
    else if (!c.list || !c.list.length) h += '<div class="empty">' + esc(t('noCaddies')) + '</div>';
    else {
      h += '<div class="cg">' + c.list.map(function (r) {
        var busy = c.time ? busyAt(r, c.time) : (r.day_off ? t('dayOff') : null);
        var ph = r.photo_url ? '<img class="ph" src="' + esc(/^(https?:|\/)/.test(r.photo_url) ? r.photo_url : '/' + r.photo_url) + '" alt="" loading="lazy">' : '<div class="ph none"><span class="msi">person</span></div>';
        return '<button class="cd' + (c.pick === r.id ? ' pick' : '') + (busy ? ' busy' : '') + '" data-act="pick" data-id="' + r.id + '"' + (busy ? ' disabled' : '') + '><span class="no">' + esc(r.caddy_number || '') + '</span>' + ph +
          '<div class="cn">' + esc(r.name || ('#' + (r.caddy_number || ''))) + '</div><div class="cr">' + esc(busy || r.course_name) + '</div></button>';
      }).join('') + '</div>';
    }
    var picked = c.list && c.list.find(function (r) { return r.id === c.pick; });
    h += '</div><div class="stick"><div class="sum">' + (picked ? esc(longDate(c.date) + ' · ' + (c.time || '') + ' · ') + '<b>#' + esc(picked.caddy_number) + (picked.name ? ' ' + esc(picked.name) : '') + '</b>' : esc(c.time ? t('choose') : t('pickTime'))) + '</div>' +
      '<button class="big" data-act="book"' + (picked && c.time ? '' : ' disabled') + ' style="margin-top:8px"><span class="msi">event_available</span>' + esc(t('req')) + '</button>' +
      (c.eventId ? '<button class="big ghost" data-act="home" style="margin-top:8px">' + esc(t('skip')) + '</button>' : '') + '</div>';
    app.innerHTML = h;
  }

  function render() {
    if (!V.venue) { app.innerHTML = '<div class="hero"><div class="logo"><span class="msi">qr_code_2</span></div><h1>MyCaddiPro</h1><p>' + esc(t('venueUnknown')) + '</p></div>'; return; }
    document.title = V.name + ' · MyCaddiPro';
    if (!S.token || !S.me) return renderSignin();
    if (S.view === 'caddy' && S.cad) renderCaddy(); else renderHome();
    renderSheet();
  }

  // ---------- actions ----------
  function errText(e) {
    var m = (e && e.message) || '';
    if (/QR_CUTOFF/.test(m)) return t('closed');
    if (/QR_LIMIT/.test(m)) return t('limit');
    if (/day off/.test(m)) return t('dayOff');
    return t('err');
  }
  document.addEventListener('click', async function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (act !== 'unreg' && act !== 'uncad') S.armed = null;
    if (act === 'reg') { S.sheet = { id: id, van: true, cad: false, comp: false }; S.flash = null; return renderSheet(); }
    if (act === 'close') { S.sheet = null; return renderSheet(); }
    if (act === 'opt') { var k = b.getAttribute('data-k'); S.sheet[k] = !S.sheet[k]; return renderSheet(); }
    if (act === 'confirm') {
      var o = S.sheet, e = S.events.find(function (x) { return x.id === o.id; }); if (!e) return;
      b.disabled = true; veil(true);
      try {
        var r = await rpc('qr_register', { p_token: S.token, p_event_id: e.id, p_transport: !!o.van, p_competition: !!o.comp, p_want_caddy: !!o.cad });
        S.sheet = null;
        if (r && r.full) { toast(t('fullMsg')); await load(); return render(); }
        S.flash = { title: t('youIn', { n: (S.me.name || '').split(' ')[0] }), body: t('youInSub', { e: socAbbr(e) + ' · ' + shortTitle(e), d: longDate(e.event_date) }) };
        await load();
        if (o.cad) { S.view = 'caddy'; S.cad = { date: e.event_date, time: String(e.start_time || '').slice(0, 5), eventId: e.id, pick: null, list: null }; render(); return loadCaddies(); }
        render(); window.scrollTo(0, 0);
      } catch (err) { toast(errText(err)); console.warn('[QR] register', err); S.sheet = null; render(); }
      finally { veil(false); }
      return;
    }
    if (act === 'unreg' || act === 'uncad') {
      if (S.armed !== id) { S.armed = id; render(); setTimeout(function () { if (S.armed === id) { S.armed = null; render(); } }, 3500); return; }
      S.armed = null; veil(true);
      try {
        if (act === 'unreg') await rpc('qr_cancel_registration', { p_token: S.token, p_event_id: id });
        else await rpc('qr_cancel_caddy', { p_token: S.token, p_booking_id: id });
        S.flash = null; toast(act === 'unreg' ? t('cancelled') : '✓'); await load();
      } catch (err) { toast(errText(err)); console.warn('[QR] cancel', err); }
      finally { veil(false); render(); }
      return;
    }
    if (act === 'caddy') { S.view = 'caddy'; S.flash = null; S.cad = { date: firstDay(), time: null, eventId: null, pick: null, list: null }; render(); window.scrollTo(0, 0); return loadCaddies(); }
    if (act === 'day') { S.cad.date = b.getAttribute('data-d'); S.cad.pick = null; S.cad.time = null; return loadCaddies(); }
    if (act === 'time') { S.cad.time = b.getAttribute('data-t'); var p = S.cad.list && S.cad.list.find(function (r) { return r.id === S.cad.pick; }); if (p && busyAt(p, S.cad.time)) S.cad.pick = null; return render(); }
    if (act === 'pick') { S.cad.pick = id; return render(); }
    if (act === 'book') {
      var c = S.cad; b.disabled = true; veil(true);
      try {
        var res = await rpc('qr_book_caddy', { p_token: S.token, p_caddy_id: c.pick, p_date: c.date, p_time: c.time, p_course_slug: '', p_event_id: c.eventId || null });
        if (res && res.taken) { toast(t('taken')); c.pick = null; return loadCaddies(); }
        if (S.flash) S.flash.body = (S.flash.body ? S.flash.body + ' ' : '') + t('reqd'); else S.flash = { title: t('reqd'), body: '' };
        S.view = 'home'; S.cad = null; await load(); render(); window.scrollTo(0, 0);
      } catch (err) { toast(errText(err)); console.warn('[QR] book', err); render(); }
      finally { veil(false); }
      return;
    }
    if (act === 'home') { S.view = 'home'; S.cad = null; render(); window.scrollTo(0, 0); return; }
    if (act === 'out') { S.token = null; S.me = null; lsSet('qrg_token', null); lsSet('qrg_me', null); render(); return; }
  });

  // paint first: a known phone sees its page immediately, the live data follows
  render();
  if (V.venue && S.token) load().then(render).catch(function (e) { console.warn('[QR] load', e); S.loaded = true; render(); });
  // the list keeps itself fresh while the page stays open (new regs, closed games)
  document.addEventListener('visibilitychange', function () { if (!document.hidden && V.venue && S.token && S.view === 'home' && !S.sheet) load().then(render).catch(function () {}); });
})();
</script>
</body>
</html>
